<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéFooter Widget</title>
    <style>
        /* 設定背景為透明，這是為了讓您可以嵌入到其他網頁中
        */
        :root {
            /* 釘死 light：iframe 要維持「透明」，內外文件的 color-scheme 必須一致。
               千萬別改成 light dark——那會讓 widget 在「OS 深色模式 + 嵌入方沒宣告
               color-scheme」這個最常見的組合下自己解析成 dark，跟嵌入方（light）
               不一致，瀏覽器直接墊一塊不透明黑底（比白底更糟，踩過一次）。
               釘死 light 對上所有未宣告的嵌入方；真的宣告了 dark 的頁面（例如本專案
               的 params.html），請在「iframe 元素」上加 color-scheme: light 對齊 */
            color-scheme: light;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止出現卷軸 */
            background-color: transparent;
        }

        #app {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px; /* 寶可夢活動區域的高度 */
            pointer-events: none; /* 讓滑鼠點擊穿透，不會擋住背後的內容 */
        }

        .pokemon-container {
            position: absolute;
            bottom: 0;
            /* 讓圖片呈現像素風格，比較復古可愛 */
            image-rendering: pixelated; 
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            /* 注意：這裡「不能」對 transform 掛 transition！
               位置每一幀都在更新，若套上緩動會永遠追不上目標，
               看起來就像在冰上飄移；轉向的鏡像也會經過 scaleX(0) 被壓扁成一條線 */
            cursor: grab; /* 左鍵按下去就抓得起來，游標先把這件事講清楚 */
            pointer-events: auto; /* 讓寶可夢本身可以被互動（如果有的話） */
            will-change: transform;
            /* 長按拖曳用：觸控裝置上別把「按住不放再滑」解讀成捲動手勢，
               也別讓長按選字的反白框跑出來 */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* iOS 長按跳出的「儲存圖片」選單會蓋掉拖曳 */
        }

        /* 被抓在手上的那一隻：游標換成「抓握中」 */
        .pokemon-container.held {
            cursor: grabbing;
        }

        /* 簡單的陰影，增加立體感。
           bottom: 0 讓橢圓最低點貼齊頁面底邊（站立狀態）；
           跳躍時影子用 scale 縮小、會離開底邊，那是預期效果 */
        .shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: -1;
        }

        /* 發呆時的心情對話框。這裡只放頭頂正上方的預設值，
           實際擺位由 JS 的 placeBubble() 依 bubblePosition 覆寫
           （top 頭頂 / side 面向側邊，side 還會跟著面向左右換邊 + 鏡像尾巴），
           上下層由 bubbleLayer 決定（z-index 也在 placeBubble() 設）。
           圖是 canvas 畫的小尺寸點陣圖，靠 pixelated 整數倍放大維持鋸齒感 */
        .bubble {
            position: absolute;
            bottom: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
        }

        /* 客串事件：從畫面外高速橫越的飛行系/傳說寶可夢。
           不可點擊（飛太快，也不是常駐成員）、蓋在所有散步成員上方 */
        .cameo {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 10000;
            will-change: transform;
        }

        /* 主題地面（theme 參數）：鋪在頁面最底、所有寶可夢身後的像素地面。
           貼片是載入時用 canvas 隨機生成的，橫向平鋪；
           水域與熔岩掛 ground-flow 讓圖樣緩慢橫向流動 */
        #ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-repeat: repeat-x;
            pointer-events: none;
        }
        .ground-flow {
            animation: ground-flow var(--flow-duration, 20s) linear infinite;
        }
        @keyframes ground-flow {
            to { background-position-x: var(--flow-width, -512px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .ground-flow { animation: none; }
        }

        /* 丟果實餵食：點「空白處」掉下的像素樹果（canvas 畫的，不吃外部素材）。
           不可點擊——它是被吃的，不是被戳的；縮放錨在底邊中央，
           被咬小時往地面收，不會浮空 */
        .berry {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 20000; /* 蓋在隊伍前面：果實小，被大體型擋住就看不到吃相了 */
            transform-origin: 50% 100%;
        }

        /* 色違登場的星星粒子：從本體中心向外飛散、漸淡。
           每顆的飛行向量由 JS 用 CSS 變數（--dx / --dy）逐顆指定，
           動畫跑完由 animationend 移除元素 */
        .burst-star {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            animation: star-burst 1.4s ease-out forwards; /* 時長只是備援，JS 會依 shinyBurstDuration 覆寫 */
        }
        @keyframes star-burst {
            0%   { transform: translate(0, 0); opacity: 1; }
            60%  { opacity: 0.95; } /* 前 60% 幾乎不淡出，亮得夠久；尾段再一口氣收乾淨 */
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        .sprite {
            display: block;
            height: 64px; /* 預設高度，實際會由 JS 依體型分級覆寫 */
            width: auto;
            margin-bottom: 1px; /* 腳底抬離底邊 1px，視覺上站進貼底的影子裡 */
            /* 預設寶可夢通常是面向左下方的，這裡不需要額外調整，JS 會控制方向 */
            transform-origin: center bottom; /* 鏡像與跳躍都以腳底為基準（被抓起來時 JS 會改成身體中心） */
            will-change: transform;
            /* <img> 預設可以被原生拖放，會拖出一張半透明鬼影蓋掉我們自己的拖曳 */
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <!-- 設定檔與靜態身高對照表（必須和本 HTML 放在同一個資料夾）
         用 <script src> 而不是 fetch()：OBS / file:// 直接開檔時，
         fetch 讀取本地檔案會被 CORS 擋下，script 標籤則不受限制 -->
    <script src="./config.js"></script>
    <script src="./pokemon_heights.js"></script>
    <script src="./pokemon_types.js"></script>
    <script src="./pokemon_cameo.js"></script>

    <script>
        // ---------------------------------------------------------
        // 配置區
        // 所有可調參數都在 config.js，身高對照表在 pokemon_heights.js
        // ---------------------------------------------------------
        const CONFIG = window.POKE_CONFIG;

        // ---------------------------------------------------------
        // URL 參數覆寫 (Query String Overrides)
        // iframe 嵌入或直接開啟時可用 ?count=5&baseSize=120 客製，
        // 不帶參數就吃 config.js 的預設值。完整參數文件見 PARAMS.md
        // ---------------------------------------------------------
        // 白名單 + 型別 + 範圍：不在表上的參數一律無視，
        // 超出範圍或非數字的值忽略並在 console 提示，確保亂帶參數也弄不壞頁面
        const QUERY_PARAMS = {
            count:            { path: ['count'],            type: 'int',   min: 1,  max: 50 },
            minId:            { path: ['minId'],            type: 'int',   min: 1,  max: 1025 },
            maxId:            { path: ['maxId'],            type: 'int',   min: 1,  max: 1025 },
            baseSpeed:        { path: ['baseSpeed'],        type: 'float', min: 0,  max: 10 },
            speedVariance:    { path: ['speedVariance'],    type: 'float', min: 0,  max: 10 },
            boundsMin:        { path: ['bounds', 'min'],    type: 'float', min: 0,  max: 1 },
            boundsMax:        { path: ['bounds', 'max'],    type: 'float', min: 0,  max: 1 },
            idleChance:       { path: ['idleChance'],       type: 'float', min: 0,  max: 1 },
            lookTimeMin:      { path: ['lookTime', 'min'],  type: 'int',   min: 0,  max: 60000 },
            lookTimeMax:      { path: ['lookTime', 'max'],  type: 'int',   min: 0,  max: 60000 },
            bubbleChance:     { path: ['bubbleChance'],     type: 'float', min: 0,  max: 1 },
            bubblePosition:   { path: ['bubblePosition'],   type: 'enum',  values: ['top', 'side', 'none'] },
            bubbleSideGap:    { path: ['bubbleSideGap'],    type: 'int',   min: -20, max: 50 },
            bubbleSideLift:   { path: ['bubbleSideLift'],   type: 'int',   min: -50, max: 100 },
            bubbleLayer:      { path: ['bubbleLayer'],      type: 'enum',  values: ['front', 'behind'] },
            idleJumpChance:   { path: ['idleJumpChance'],   type: 'float', min: 0,  max: 1 },
            shinyChance:      { path: ['shinyChance'],      type: 'float', min: 0,  max: 1 },
            shinyBurstDuration: { path: ['shinyBurstDuration'], type: 'int', min: 100, max: 10000 },
            shinyBurstScale:  { path: ['shinyBurstScale'],  type: 'float', min: 0.1, max: 5 },
            shinyBurstDelayMin: { path: ['shinyBurstDelay', 'min'], type: 'int', min: 1000, max: 600000 },
            shinyBurstDelayMax: { path: ['shinyBurstDelay', 'max'], type: 'int', min: 1000, max: 600000 },
            hopHeight:        { path: ['hopHeight'],        type: 'float', min: 0,  max: 50 },
            hopVariance:      { path: ['hopVariance'],      type: 'float', min: 0,  max: 50 },
            hopFrequency:     { path: ['hopFrequency'],     type: 'float', min: 0,  max: 1 },
            personalSpace:    { path: ['personalSpace'],    type: 'int',   min: 0,  max: 1000 },
            greetChance:      { path: ['greetChance'],      type: 'float', min: 0,  max: 1 },
            baseSize:         { path: ['baseSize'],         type: 'int',   min: 16, max: 512 },
            shadowWidthRatio: { path: ['shadowWidthRatio'], type: 'float', min: 0,  max: 2 },
            theme:            { path: ['theme'],            type: 'enum',  values: ['none', 'grass', 'water', 'snow', 'sand', 'rock', 'dirt', 'lava'] },
            themeHeight:      { path: ['themeHeight'],      type: 'int',   min: 4,  max: 200 },
            flybyDelayMin:    { path: ['flybyDelay', 'min'], type: 'int',  min: 1000, max: 600000 },
            flybyDelayMax:    { path: ['flybyDelay', 'max'], type: 'int',  min: 1000, max: 600000 },
            flybyChance:      { path: ['flybyChance'],      type: 'float', min: 0,  max: 1 },
            flybyLegendaryChance: { path: ['flybyLegendaryChance'], type: 'float', min: 0, max: 1 },
            flybyDeliveryChance:  { path: ['flybyDeliveryChance'],  type: 'float', min: 0, max: 1 },
            flybySpeed:       { path: ['flybySpeed'],       type: 'float', min: 1,  max: 100 },
            remote:           { path: ['remote'],           type: 'enum',  values: ['on', 'off'] },
            remoteRateLimit:  { path: ['remoteRateLimit'],  type: 'int',   min: 1,  max: 100 },
            berry:            { path: ['berry'],            type: 'enum',  values: ['on', 'off'] },
            drag:             { path: ['drag'],             type: 'enum',  values: ['on', 'off'] },
            dragStruggleRate: { path: ['dragStruggleRate'], type: 'float', min: 0,  max: 10 },
        };

        function applyQueryOverrides(config) {
            const qs = new URLSearchParams(location.search);

            for (const [name, spec] of Object.entries(QUERY_PARAMS)) {
                const raw = qs.get(name);
                if (raw === null) continue;
                let value;
                if (spec.type === 'enum') {
                    value = raw.toLowerCase();
                    if (!spec.values.includes(value)) {
                        console.warn(`[PokéFooter] 忽略不合法的參數 ${name}=${raw}（允許值：${spec.values.join(' / ')}）`);
                        continue;
                    }
                } else {
                    value = spec.type === 'int' ? parseInt(raw, 10) : parseFloat(raw);
                    if (Number.isNaN(value) || value < spec.min || value > spec.max) {
                        console.warn(`[PokéFooter] 忽略不合法的參數 ${name}=${raw}（允許範圍 ${spec.min} ~ ${spec.max}）`);
                        continue;
                    }
                }
                let target = config;
                for (const key of spec.path.slice(0, -1)) target = target[key];
                target[spec.path[spec.path.length - 1]] = value;
            }

            // ids=25,133,6：固定生成清單（取代 count/minId/maxId 的隨機抽選）。
            // 允許重複編號（五隻伊布也是一種浪漫），上限 50 隻
            const ids = qs.get('ids');
            if (ids !== null) {
                const list = ids.split(',')
                    .map(s => parseInt(s.trim(), 10))
                    .filter(n => Number.isInteger(n) && n >= 1 && n <= 1025)
                    .slice(0, 50);
                if (list.length) {
                    config.fixedIds = list;
                    config.count = list.length; // 跑道數要跟實際隻數一致
                } else {
                    console.warn('[PokéFooter] ids 參數沒有任何合法編號（1~1025），已忽略');
                }
            }

            // 參數彼此的合理性修正：
            // 順序顛倒就對調；count 超過可抽的編號數量會讓抽選迴圈卡死，必須夾住
            if (config.minId > config.maxId) [config.minId, config.maxId] = [config.maxId, config.minId];
            if (config.lookTime.min > config.lookTime.max) [config.lookTime.min, config.lookTime.max] = [config.lookTime.max, config.lookTime.min];
            if (config.flybyDelay && config.flybyDelay.min > config.flybyDelay.max) [config.flybyDelay.min, config.flybyDelay.max] = [config.flybyDelay.max, config.flybyDelay.min];
            if (config.shinyBurstDelay && config.shinyBurstDelay.min > config.shinyBurstDelay.max) [config.shinyBurstDelay.min, config.shinyBurstDelay.max] = [config.shinyBurstDelay.max, config.shinyBurstDelay.min];
            if (config.bounds.min >= config.bounds.max) {
                console.warn('[PokéFooter] boundsMin 必須小於 boundsMax，已改回預設 0.1 ~ 0.9');
                config.bounds = { min: 0.1, max: 0.9 };
            }
            // 活動範圍還得塞得下最大體型：太窄時邊界檢查會出現 maxX < minX 的矛盾。
            // 逐參數看都合法、組合起來卻出事的典型，載入時先擋一次
            // （update() 內另有逐幀保險，處理載入後縮放視窗等剩餘情況）。
            // 1.5 倍是「最寬的橫向系寶可夢」的經驗係數；已是預設範圍就不再動
            if ((config.bounds.max - config.bounds.min) * window.innerWidth < config.baseSize * 1.5
                && !(config.bounds.min === 0.1 && config.bounds.max === 0.9)) {
                console.warn('[PokéFooter] 活動範圍太窄，塞不下最大體型，已改回預設 0.1 ~ 0.9');
                config.bounds = { min: 0.1, max: 0.9 };
            }
            if (!config.fixedIds) {
                config.count = Math.min(config.count, config.maxId - config.minId + 1);
            }
        }

        // ---------------------------------------------------------
        // 工具函式 (Utils)
        // ---------------------------------------------------------
        
        // 產生範圍內的隨機整數
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 產生不重複的隨機 ID 陣列
        function getUniqueRandomIds(count, min, max) {
            const ids = new Set();
            while(ids.size < count) {
                ids.add(randomInt(min, max));
            }
            return Array.from(ids);
        }

        // 查不到身高時的保底體型：取 sizeTiers 正中間那一級（預設三級 = 中型）。
        // 不寫死數字，調整 sizeTiers 時保底值會自己跟上
        function fallbackSizeScale() {
            const tiers = CONFIG.sizeTiers ?? [];
            return tiers[Math.floor(tiers.length / 2)]?.scale ?? 1;
        }

        // 依身高換算成大中小的縮放比例：
        // 優先查本地靜態對照表（pokemon_heights.js，離線可用、不打 API），
        // 查不到才退回 PokéAPI，再失敗就當中型
        async function getSizeScale(id) {
            let deciMeters = window.POKE_HEIGHTS ? window.POKE_HEIGHTS[id] : undefined;

            if (deciMeters === undefined) {
                try {
                    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                    const data = await res.json();
                    deciMeters = data.height; // API 的 height 單位是分米 (0.1 公尺)
                } catch (e) {
                    return fallbackSizeScale(); // 查不到身高就當中型
                }
            }

            const meters = deciMeters / 10;
            const tier = CONFIG.sizeTiers.find(t => meters < t.maxMeters);
            return tier ? tier.scale : fallbackSizeScale();
        }

        // ---------------------------------------------------------
        // 發呆心情對話框 (Emote Bubble)
        // 對話框與圖示都是手繪的字元畫像素圖：
        // 字元畫 → canvas 逐格上色 → dataURL 當 <img> 用，
        // 顯示時整數倍放大 + image-rendering: pixelated 維持點陣風格。
        // 不依賴任何外部圖檔，離線也能用。
        // ---------------------------------------------------------
        const EMOTE_PALETTE = {
            '#': '#2b2b2b', // 外框黑 / 線條
            'w': '#ffffff', // 對話框底白
            'r': '#e8455a', // 愛心紅 / 驚嘆號紅
            'b': '#9c6a33', // 大便棕
            'B': '#6e4620', // 大便深棕（底部陰影）
            'u': '#4a6fd8', // 問號藍
            'y': '#ecb200', // 星光金
        };

        // 尾巴根部距「它勾過去那一側」邊緣的點陣圖 px（框的圓角本身就佔掉 2px）。
        // 尾巴貼近下角、不掛在正中央：對話框擺在本體側邊時，尾巴要從靠本體的那個
        // 下角伸出來才像在講話，掛中央會指向本體旁邊的空氣
        const TAIL_INSET = 6;

        // 對話框外框產生器：給定總寬度與內部（白底）列數，
        // 組出「圓角方框 + 底部尖尾巴」。概念上等同遊戲 UI 的 9-slice：
        // 四角與尾巴樣式固定，邊框依內容的 bounding box 雙向伸縮。
        // tailDir: 1 = 尾巴在右下角、朝右勾（預設）、-1 = 左下角、朝左勾
        function buildBubbleFrame(width, innerRows = 12, tailDir = 1) {
            // 尾巴開口左緣。夾在 [2, width-4]：兩端都要留得下圓角與邊框，
            // 窄框（如驚嘆號的 10px）擺不到那麼靠邊時就以夾住的位置為準
            const tail = Math.min(Math.max(2, width - TAIL_INSET), width - 4);
            const rows = [];
            rows.push('..' + '#'.repeat(width - 4) + '..');
            rows.push('.#' + 'w'.repeat(width - 4) + '#.');
            for (let i = 0; i < innerRows - 2; i++) {
                rows.push('#' + 'w'.repeat(width - 2) + '#');
            }
            rows.push('.#' + 'w'.repeat(width - 4) + '#.');
            rows.push('..' + '#'.repeat(tail - 2) + 'ww' + '#'.repeat(width - tail - 4) + '..');
            rows.push('.'.repeat(tail - 1) + '#ww#' + '.'.repeat(width - tail - 3));
            rows.push('.'.repeat(tail) + '#w#' + '.'.repeat(width - tail - 3));
            rows.push('.'.repeat(tail + 1) + '#' + '.'.repeat(width - tail - 2));
            // 尾巴朝左：整個框左右翻轉。方框本身左右對稱，
            // 所以翻轉的淨效果就只有尾巴改朝向。
            // 心情圖示是「翻轉後」才疊上去的，不會跟著鏡像
            // （音符、問號、Zzz 鏡像過去會變成錯字）
            return tailDir === -1 ? rows.map(row => [...row].reverse().join('')) : rows;
        }

        // 四種心情圖示（'.' 代表透明、沿用底下對話框的底色），
        // top/left 是貼進外框的位置（已置中對齊）。
        // 尺寸撐滿框內可用區，但距邊框固定保留 2px 白邊（不觸碰邊框）
        const EMOTE_ICONS = {
            heart: { top: 3, left: 5, art: [   // 愛心
                '.rr....rr.',
                'rrrr..rrrr',
                'rrrrrrrrrr',
                'rrrrrrrrrr',

            ]},
            note: { top: 3, left: 6, art: [    // 音符
                '....##..',
                '....#.#.',
                '....#..#',
                '....#.#.',
                '....#...',

                '.####...',

            ]},
            scribble: { top: 3, left: 4, art: [ // 一團黑線（心情阿雜）
                '...##.##....',
                '.##..#..##..',
                '#..##.##..#.',
                '.##.#..#.##.',
                '#..##.##..##',

            ]},
            poop: { top: 3, left: 5, art: [    // 大便（三層堆疊 + 右彎尖端）
                '.....bb...',
                '...bbb....',
                '...bbb....',
                '..bbbbbb..',
                '..bbbbbb..',
                'bbbbbbbbbb',
                'bbbbbbbbbb',
                '.BBBBBBBB.',
            ]},
            zzz: { top: 3, left: 3, frameWidth: 23, art: [ // Zzz（小中大三個 Z 沿對角線往右上爬升）
                '...........######',
                '...............#.',
                '..............#..',
                '.....#####...#...',
                '........#...#....',
                '.......#...######',
                '####..#..........',
                '..#..#####.......',
                '.#...............',
                '####.............',
            ]},
            exclaim: { top: 3, left: 3, frameWidth: 10, art: [ // 驚嘆號（紅色，4→2 收窄 + 2x2 圓點）
                'rrrr',
                'rrrr',
                'rrrr',
                '.rr.',
                '.rr.',

                '....',
                '.rr.',

            ]},
            question: { top: 3, left: 3, frameWidth: 14, art: [ // 問號（藍色，粗筆畫圓頂 + 2x2 圓點）
                '.uuuuu..',
                'uuuuuuu.',
                'uu...uuu',
                '.....uuu',
                '...uuuu.',
                '...uu...',

            ]},
            sparkle: { top: 3, left: 3, frameWidth: 16, art: [ // 金色閃光（實心四芒星，如 emoji ✨），也是色違登場的專屬署名
                '....yy....',
                '....yy....',
                '...yyyy...',
