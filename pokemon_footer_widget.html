<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéFooter Widget</title>
    <style>
        /* 設定背景為透明，這是為了讓您可以嵌入到其他網頁中 
        */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止出現卷軸 */
            background-color: transparent; 
        }

        #app {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px; /* 寶可夢活動區域的高度 */
            pointer-events: none; /* 讓滑鼠點擊穿透，不會擋住背後的內容 */
        }

        .pokemon-container {
            position: absolute;
            bottom: 0;
            /* 讓圖片呈現像素風格，比較復古可愛 */
            image-rendering: pixelated; 
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            /* 注意：這裡「不能」對 transform 掛 transition！
               位置每一幀都在更新，若套上緩動會永遠追不上目標，
               看起來就像在冰上飄移；轉向的鏡像也會經過 scaleX(0) 被壓扁成一條線 */
            cursor: pointer;
            pointer-events: auto; /* 讓寶可夢本身可以被互動（如果有的話） */
            will-change: transform;
        }

        /* 簡單的陰影，增加立體感。
           bottom: 0 讓橢圓最低點貼齊頁面底邊（站立狀態）；
           跳躍時影子用 scale 縮小、會離開底邊，那是預期效果 */
        .shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: -1;
        }

        /* 發呆時的心情對話框。這裡只放頭頂正上方的預設值，
           實際擺位由 JS 的 placeBubble() 依 bubblePosition 覆寫
           （top 頭頂 / side 面向側邊，side 還會跟著面向左右換邊 + 鏡像尾巴），
           上下層由 bubbleLayer 決定（z-index 也在 placeBubble() 設）。
           圖是 canvas 畫的小尺寸點陣圖，靠 pixelated 整數倍放大維持鋸齒感 */
        .bubble {
            position: absolute;
            bottom: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
        }

        /* 色違登場的星星粒子：從本體中心向外飛散、漸淡。
           每顆的飛行向量由 JS 用 CSS 變數（--dx / --dy）逐顆指定，
           動畫跑完由 animationend 移除元素 */
        .burst-star {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            animation: star-burst 1.4s ease-out forwards; /* 時長只是備援，JS 會依 shinyBurstDuration 覆寫 */
        }
        @keyframes star-burst {
            0%   { transform: translate(0, 0); opacity: 1; }
            60%  { opacity: 0.95; } /* 前 60% 幾乎不淡出，亮得夠久；尾段再一口氣收乾淨 */
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        .sprite {
            display: block;
            height: 64px; /* 預設高度，實際會由 JS 依體型分級覆寫 */
            width: auto;
            margin-bottom: 1px; /* 腳底抬離底邊 1px，視覺上站進貼底的影子裡 */
            /* 預設寶可夢通常是面向左下方的，這裡不需要額外調整，JS 會控制方向 */
            transform-origin: center bottom; /* 鏡像與跳躍都以腳底為基準 */
            will-change: transform;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <!-- 設定檔與靜態身高對照表（必須和本 HTML 放在同一個資料夾）
         用 <script src> 而不是 fetch()：OBS / file:// 直接開檔時，
         fetch 讀取本地檔案會被 CORS 擋下，script 標籤則不受限制 -->
    <script src="./config.js"></script>
    <script src="./pokemon_heights.js"></script>
    <script src="./pokemon_types.js"></script>

    <script>
        // ---------------------------------------------------------
        // 配置區
        // 所有可調參數都在 config.js，身高對照表在 pokemon_heights.js
        // ---------------------------------------------------------
        const CONFIG = window.POKE_CONFIG;

        // ---------------------------------------------------------
        // URL 參數覆寫 (Query String Overrides)
        // iframe 嵌入或直接開啟時可用 ?count=5&baseSize=120 客製，
        // 不帶參數就吃 config.js 的預設值。完整參數文件見 PARAMS.md
        // ---------------------------------------------------------
        // 白名單 + 型別 + 範圍：不在表上的參數一律無視，
        // 超出範圍或非數字的值忽略並在 console 提示，確保亂帶參數也弄不壞頁面
        const QUERY_PARAMS = {
            count:            { path: ['count'],            type: 'int',   min: 1,  max: 50 },
            minId:            { path: ['minId'],            type: 'int',   min: 1,  max: 1025 },
            maxId:            { path: ['maxId'],            type: 'int',   min: 1,  max: 1025 },
            baseSpeed:        { path: ['baseSpeed'],        type: 'float', min: 0,  max: 10 },
            speedVariance:    { path: ['speedVariance'],    type: 'float', min: 0,  max: 10 },
            boundsMin:        { path: ['bounds', 'min'],    type: 'float', min: 0,  max: 1 },
            boundsMax:        { path: ['bounds', 'max'],    type: 'float', min: 0,  max: 1 },
            idleChance:       { path: ['idleChance'],       type: 'float', min: 0,  max: 1 },
            lookTimeMin:      { path: ['lookTime', 'min'],  type: 'int',   min: 0,  max: 60000 },
            lookTimeMax:      { path: ['lookTime', 'max'],  type: 'int',   min: 0,  max: 60000 },
            bubbleChance:     { path: ['bubbleChance'],     type: 'float', min: 0,  max: 1 },
            bubblePosition:   { path: ['bubblePosition'],   type: 'enum',  values: ['top', 'side', 'none'] },
            bubbleSideGap:    { path: ['bubbleSideGap'],    type: 'int',   min: -20, max: 50 },
            bubbleLayer:      { path: ['bubbleLayer'],      type: 'enum',  values: ['front', 'behind'] },
            idleJumpChance:   { path: ['idleJumpChance'],   type: 'float', min: 0,  max: 1 },
            shinyChance:      { path: ['shinyChance'],      type: 'float', min: 0,  max: 1 },
            shinyBurstDuration: { path: ['shinyBurstDuration'], type: 'int', min: 100, max: 10000 },
            hopHeight:        { path: ['hopHeight'],        type: 'float', min: 0,  max: 50 },
            hopVariance:      { path: ['hopVariance'],      type: 'float', min: 0,  max: 50 },
            hopFrequency:     { path: ['hopFrequency'],     type: 'float', min: 0,  max: 1 },
            personalSpace:    { path: ['personalSpace'],    type: 'int',   min: 0,  max: 1000 },
            baseSize:         { path: ['baseSize'],         type: 'int',   min: 16, max: 512 },
            shadowWidthRatio: { path: ['shadowWidthRatio'], type: 'float', min: 0,  max: 2 },
        };

        function applyQueryOverrides(config) {
            const qs = new URLSearchParams(location.search);

            for (const [name, spec] of Object.entries(QUERY_PARAMS)) {
                const raw = qs.get(name);
                if (raw === null) continue;
                let value;
                if (spec.type === 'enum') {
                    value = raw.toLowerCase();
                    if (!spec.values.includes(value)) {
                        console.warn(`[PokéFooter] 忽略不合法的參數 ${name}=${raw}（允許值：${spec.values.join(' / ')}）`);
                        continue;
                    }
                } else {
                    value = spec.type === 'int' ? parseInt(raw, 10) : parseFloat(raw);
                    if (Number.isNaN(value) || value < spec.min || value > spec.max) {
                        console.warn(`[PokéFooter] 忽略不合法的參數 ${name}=${raw}（允許範圍 ${spec.min} ~ ${spec.max}）`);
                        continue;
                    }
                }
                let target = config;
                for (const key of spec.path.slice(0, -1)) target = target[key];
                target[spec.path[spec.path.length - 1]] = value;
            }

            // ids=25,133,6：固定生成清單（取代 count/minId/maxId 的隨機抽選）。
            // 允許重複編號（五隻伊布也是一種浪漫），上限 50 隻
            const ids = qs.get('ids');
            if (ids !== null) {
                const list = ids.split(',')
                    .map(s => parseInt(s.trim(), 10))
                    .filter(n => Number.isInteger(n) && n >= 1 && n <= 1025)
                    .slice(0, 50);
                if (list.length) {
                    config.fixedIds = list;
                    config.count = list.length; // 跑道數要跟實際隻數一致
                } else {
                    console.warn('[PokéFooter] ids 參數沒有任何合法編號（1~1025），已忽略');
                }
            }

            // 參數彼此的合理性修正：
            // 順序顛倒就對調；count 超過可抽的編號數量會讓抽選迴圈卡死，必須夾住
            if (config.minId > config.maxId) [config.minId, config.maxId] = [config.maxId, config.minId];
            if (config.lookTime.min > config.lookTime.max) [config.lookTime.min, config.lookTime.max] = [config.lookTime.max, config.lookTime.min];
            if (config.bounds.min >= config.bounds.max) {
                console.warn('[PokéFooter] boundsMin 必須小於 boundsMax，已改回預設 0.1 ~ 0.9');
                config.bounds = { min: 0.1, max: 0.9 };
            }
            // 活動範圍還得塞得下最大體型：太窄時邊界檢查會出現 maxX < minX 的矛盾。
            // 逐參數看都合法、組合起來卻出事的典型，載入時先擋一次
            // （update() 內另有逐幀保險，處理載入後縮放視窗等剩餘情況）。
            // 1.5 倍是「最寬的橫向系寶可夢」的經驗係數；已是預設範圍就不再動
            if ((config.bounds.max - config.bounds.min) * window.innerWidth < config.baseSize * 1.5
                && !(config.bounds.min === 0.1 && config.bounds.max === 0.9)) {
                console.warn('[PokéFooter] 活動範圍太窄，塞不下最大體型，已改回預設 0.1 ~ 0.9');
                config.bounds = { min: 0.1, max: 0.9 };
            }
            if (!config.fixedIds) {
                config.count = Math.min(config.count, config.maxId - config.minId + 1);
            }
        }

        // ---------------------------------------------------------
        // 工具函式 (Utils)
        // ---------------------------------------------------------
        
        // 產生範圍內的隨機整數
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 產生不重複的隨機 ID 陣列
        function getUniqueRandomIds(count, min, max) {
            const ids = new Set();
            while(ids.size < count) {
                ids.add(randomInt(min, max));
            }
            return Array.from(ids);
        }

        // 查不到身高時的保底體型：取 sizeTiers 正中間那一級（預設三級 = 中型）。
        // 不寫死數字，調整 sizeTiers 時保底值會自己跟上
        function fallbackSizeScale() {
            const tiers = CONFIG.sizeTiers ?? [];
            return tiers[Math.floor(tiers.length / 2)]?.scale ?? 1;
        }

        // 依身高換算成大中小的縮放比例：
        // 優先查本地靜態對照表（pokemon_heights.js，離線可用、不打 API），
        // 查不到才退回 PokéAPI，再失敗就當中型
        async function getSizeScale(id) {
            let deciMeters = window.POKE_HEIGHTS ? window.POKE_HEIGHTS[id] : undefined;

            if (deciMeters === undefined) {
                try {
                    const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                    const data = await res.json();
                    deciMeters = data.height; // API 的 height 單位是分米 (0.1 公尺)
                } catch (e) {
                    return fallbackSizeScale(); // 查不到身高就當中型
                }
            }

            const meters = deciMeters / 10;
            const tier = CONFIG.sizeTiers.find(t => meters < t.maxMeters);
            return tier ? tier.scale : fallbackSizeScale();
        }

        // ---------------------------------------------------------
        // 發呆心情對話框 (Emote Bubble)
        // 對話框與圖示都是手繪的字元畫像素圖：
        // 字元畫 → canvas 逐格上色 → dataURL 當 <img> 用，
        // 顯示時整數倍放大 + image-rendering: pixelated 維持點陣風格。
        // 不依賴任何外部圖檔，離線也能用。
        // ---------------------------------------------------------
        const EMOTE_PALETTE = {
            '#': '#2b2b2b', // 外框黑 / 線條
            'w': '#ffffff', // 對話框底白
            'r': '#e8455a', // 愛心紅 / 驚嘆號紅
            'b': '#9c6a33', // 大便棕
            'B': '#6e4620', // 大便深棕（底部陰影）
            'u': '#4a6fd8', // 問號藍
            'y': '#ecb200', // 星光金
        };

        // 尾巴根部距「它勾過去那一側」邊緣的點陣圖 px（框的圓角本身就佔掉 2px）。
        // 尾巴貼近下角、不掛在正中央：對話框擺在本體側邊時，尾巴要從靠本體的那個
        // 下角伸出來才像在講話，掛中央會指向本體旁邊的空氣
        const TAIL_INSET = 6;

        // 對話框外框產生器：給定總寬度與內部（白底）列數，
        // 組出「圓角方框 + 底部尖尾巴」。概念上等同遊戲 UI 的 9-slice：
        // 四角與尾巴樣式固定，邊框依內容的 bounding box 雙向伸縮。
        // tailDir: 1 = 尾巴在右下角、朝右勾（預設）、-1 = 左下角、朝左勾
        function buildBubbleFrame(width, innerRows = 12, tailDir = 1) {
            // 尾巴開口左緣。夾在 [2, width-4]：兩端都要留得下圓角與邊框，
            // 窄框（如驚嘆號的 10px）擺不到那麼靠邊時就以夾住的位置為準
            const tail = Math.min(Math.max(2, width - TAIL_INSET), width - 4);
            const rows = [];
            rows.push('..' + '#'.repeat(width - 4) + '..');
            rows.push('.#' + 'w'.repeat(width - 4) + '#.');
            for (let i = 0; i < innerRows - 2; i++) {
                rows.push('#' + 'w'.repeat(width - 2) + '#');
            }
            rows.push('.#' + 'w'.repeat(width - 4) + '#.');
            rows.push('..' + '#'.repeat(tail - 2) + 'ww' + '#'.repeat(width - tail - 4) + '..');
            rows.push('.'.repeat(tail - 1) + '#ww#' + '.'.repeat(width - tail - 3));
            rows.push('.'.repeat(tail) + '#w#' + '.'.repeat(width - tail - 3));
            rows.push('.'.repeat(tail + 1) + '#' + '.'.repeat(width - tail - 2));
            // 尾巴朝左：整個框左右翻轉。方框本身左右對稱，
            // 所以翻轉的淨效果就只有尾巴改朝向。
            // 心情圖示是「翻轉後」才疊上去的，不會跟著鏡像
            // （音符、問號、Zzz 鏡像過去會變成錯字）
            return tailDir === -1 ? rows.map(row => [...row].reverse().join('')) : rows;
        }

        // 四種心情圖示（'.' 代表透明、沿用底下對話框的底色），
        // top/left 是貼進外框的位置（已置中對齊）。
        // 尺寸撐滿框內可用區，但距邊框固定保留 2px 白邊（不觸碰邊框）
        const EMOTE_ICONS = {
            heart: { top: 3, left: 5, art: [   // 愛心
                '.rr....rr.',
                'rrrr..rrrr',
                'rrrrrrrrrr',
                'rrrrrrrrrr',
                '.rrrrrrrr.',
                '..rrrrrr..',
                '...rrrr...',
                '....rr....',
            ]},
            note: { top: 3, left: 6, art: [    // 音符
                '....##..',
                '....#.#.',
                '....#..#',
                '....#.#.',
                '....#...',
                '..###...',
                '.####...',
                '..##....',
            ]},
            scribble: { top: 3, left: 4, art: [ // 一團黑線（心情阿雜）
                '...##.##....',
                '.##..#..##..',
                '#..##.##..#.',
                '.##.#..#.##.',
                '#..##.##..##',
                '.#.#..#.##..',
                '..##.##.#...',
                '....#.#.....',
            ]},
            poop: { top: 3, left: 5, art: [    // 大便（三層堆疊 + 右彎尖端）
                '.....bb...',
                '...bbb....',
                '...bbb....',
                '..bbbbbb..',
                '..bbbbbb..',
                'bbbbbbbbbb',
                'bbbbbbbbbb',
                '.BBBBBBBB.',
            ]},
            zzz: { top: 3, left: 3, frameWidth: 23, art: [ // Zzz（小中大三個 Z 沿對角線往右上爬升）
                '...........######',
                '...............#.',
                '..............#..',
                '.....#####...#...',
                '........#...#....',
                '.......#...######',
                '####..#..........',
                '..#..#####.......',
                '.#...............',
                '####.............',
            ]},
            exclaim: { top: 3, left: 3, frameWidth: 10, art: [ // 驚嘆號（紅色，4→2 收窄 + 2x2 圓點）
                'rrrr',
                'rrrr',
                'rrrr',
                '.rr.',
                '.rr.',
                '.rr.',
                '....',
                '.rr.',
                '.rr.',
            ]},
            question: { top: 3, left: 3, frameWidth: 14, art: [ // 問號（藍色，粗筆畫圓頂 + 2x2 圓點）
                '.uuuuu..',
                'uuuuuuu.',
                'uu...uuu',
                '.....uuu',
                '...uuuu.',
                '...uu...',
                '........',
                '...uu...',
                '...uu...',
            ]},
            sparkle: { top: 3, left: 3, frameWidth: 16, art: [ // 金色閃光（實心四芒星，如 emoji ✨），也是色違登場的專屬署名
                '....yy....',
                '....yy....',
                '...yyyy...',
                '..yyyyyy..',
                'yyyyyyyyyy',
                'yyyyyyyyyy',
                '..yyyyyy..',
                '...yyyy...',
                '....yy....',
                '....yy....',
            ]},
        };

        // 把圖示疊進對話框、畫到 canvas，回傳 dataURL
        // （同圖案 × 同尾巴朝向只畫一次，之後走快取）
        const emoteCache = {};
        function getEmoteURI(name, tailDir = 1) {
            const key = `${name}:${tailDir}`;
            if (emoteCache[key]) return emoteCache[key];
            const icon = EMOTE_ICONS[name];
            // 內部列數自動配合圖案高度（上下各留 2px 白邊），最少維持 12
            const innerRows = Math.max(12, icon.art.length + 4);
            const rows = buildBubbleFrame(icon.frameWidth ?? 20, innerRows, tailDir).map((row, r) => {
                const overlay = icon.art[r - icon.top];
                if (!overlay) return row;
                const patched = [...overlay].map((ch, i) => ch === '.' ? row[icon.left + i] : ch).join('');
                return row.slice(0, icon.left) + patched + row.slice(icon.left + overlay.length);
            });
            const canvas = document.createElement('canvas');
            canvas.width = rows[0].length;
            canvas.height = rows.length;
            const ctx = canvas.getContext('2d');
            rows.forEach((row, y) => [...row].forEach((ch, x) => {
                if (EMOTE_PALETTE[ch]) {
                    ctx.fillStyle = EMOTE_PALETTE[ch];
                    ctx.fillRect(x, y, 1, 1);
                }
            }));
            return emoteCache[key] = canvas.toDataURL();
        }

        // ---------------------------------------------------------
        // 色違登場的星星粒子 (Shiny Burst)
        // 兩種尺寸的像素四芒星 × 兩種金色，canvas 畫一次就快取
        // ---------------------------------------------------------
        const STAR_ARTS = {
            big:   ['..y..', '.yyy.', 'yyyyy', '.yyy.', '..y..'],
            small: ['.y.', 'yyy', '.y.'],
        };
        const starCache = {};
        function getStarURI(shape, color) {
            const key = `${shape}:${color}`;
            if (starCache[key]) return starCache[key];
            const art = STAR_ARTS[shape];
            const canvas = document.createElement('canvas');
            canvas.width = art[0].length;
            canvas.height = art.length;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            art.forEach((row, y) => [...row].forEach((ch, x) => {
                if (ch === 'y') ctx.fillRect(x, y, 1, 1);
            }));
            return starCache[key] = canvas.toDataURL();
        }

        // ---------------------------------------------------------
        // 寶可夢類別 (Pokemon Class)
        // 這就像是用 Golang 定義一個 Struct，包含狀態與行為
        // ---------------------------------------------------------
        class Pokemon {
            constructor(id, container, sizeScale, laneIndex) {
                this.id = id;
                this.container = container;
                this.sizeScale = sizeScale;

                // 狀態屬性
                // 出生點：把「允許活動範圍」(bounds) 分成 count 條跑道，
                // 每隻站在自己跑道的中心點，再加 ±20% 跑道寬的小抖動。
                // 相鄰間距至少保有 60% 跑道寬，出生時絕不重疊；
                // 抖動則避免完美等距的「閱兵感」。
                // （取跑道中心而非頭尾等分點：count = 1 不會除以零，
                //   頭尾兩隻也不會貼著邊界出生、下一幀就觸發撞牆掉頭）
                const roamMin = window.innerWidth * CONFIG.bounds.min;
                const roamWidth = window.innerWidth * (CONFIG.bounds.max - CONFIG.bounds.min);
                const laneWidth = roamWidth / CONFIG.count;
                const jitter = (Math.random() - 0.5) * laneWidth * 0.4;
                this.x = roamMin + (laneIndex + 0.5) * laneWidth + jitter;
                this.direction = Math.random() > 0.5 ? 1 : -1; // 1: 向右, -1: 向左
                this.state = 'WALKING'; // WALKING | IDLE
                this.speed = CONFIG.baseSpeed + Math.random() * CONFIG.speedVariance; // 隨機速度差異
                this.idleTimer = 0;
                this.avoidCooldown = 0; // 因避讓而掉頭後的冷卻時間

                // 走路跳步動畫（GIF 本身只有原地待機動畫，沒有腳步，
                // 補上垂直的小跳躍才不會像滑行）
                this.walkPhase = Math.random() * Math.PI * 2; // 隨機起始相位，避免大家同步跳
                // 每隻跳的高度略有不同，體型越小跳得越低
                this.hopHeight = (CONFIG.hopHeight + Math.random() * CONFIG.hopVariance)
                                 * (0.6 + sizeScale * 0.6);
                this.bobY = 0; // 目前離地高度

                // DOM 元素建立
                this.el = document.createElement('div');
                this.el.className = 'pokemon-container';
                
                // 陰影（保留參考，跳起來時要縮小它）。
                // 寬度以「圖片實際顯示寬度」為準，讓影子跟寶可夢差不多寬；
                // 圖片載入前先用體型估一個過渡值。
                // 顏色依主屬性染色（暗色系），查不到屬性就用預設黑影
                this.shadow = document.createElement('div');
                this.shadow.className = 'shadow';
                this.shadow.style.width = `${Math.round(48 * sizeScale + 8)}px`;
                const primaryType = window.POKE_TYPES ? window.POKE_TYPES[id] : undefined;
                this.shadow.style.background =
                    CONFIG.typeShadowColors?.[primaryType] || CONFIG.typeShadowColors?.default
                    || 'rgba(0, 0, 0, 0.2)';
                this.el.appendChild(this.shadow);

                // 色違判定：每一隻「獨立」擲骰，不是一次骰全體
                this.isShiny = Math.random() < (CONFIG.shinyChance ?? 0);
                const shinyDir = this.isShiny ? 'shiny/' : '';

                // 圖片：高度依體型分級縮放（寬度 auto，會等比例跟著縮）
                this.img = document.createElement('img');
                this.img.className = 'sprite';
                this.img.style.height = `${Math.round(CONFIG.baseSize * sizeScale)}px`;
                // 使用 PokéAPI 的 GitHub Raw 資源庫，這是第五世代的動態 GIF，非常可愛
                // （色違版只差一層 shiny/ 目錄，動圖與靜圖皆同）
                this.img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${shinyDir}${this.id}.gif`;

                // 載入失敗處理 (有些稀有 ID 可能沒有動圖)。
                // 備援只有一次機會：觸發時先換掛「最終防線」再換圖，
                // 靜態圖也失敗（網路異常、來源被擋）就整隻隱藏，
                // 不露瀏覽器的破圖示，也杜絕 onerror 反覆觸發的重試迴圈
                this.img.onerror = () => {
                    this.img.onerror = () => {
                        this.img.onerror = null;
                        this.el.style.display = 'none';
                    };
                    // 動圖失敗，退回使用一般靜態圖（色違同樣有 shiny/ 靜態圖）
                    this.img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${shinyDir}${this.id}.png`;
                };

                // 圖片載入後把影子寬度對齊「實際顯示寬度 × shadowWidthRatio」
                // （換成備援圖時 load 會再觸發一次，寬度自動跟著重算）
                this.img.addEventListener('load', () => {
                    if (this.img.offsetWidth) {
                        const ratio = CONFIG.shadowWidthRatio ?? 0.9;
                        this.shadow.style.width = `${Math.round(this.img.offsetWidth * ratio)}px`;
                    }
                });

                // 心情對話框（發呆時隨機冒出）。
                // 放大倍率取整數，像素才不會被非整數縮放糊掉：小體型 2x、大體型 3x。
                // 顯示寬度依各圖案的框寬而定，在 maybeShowEmote 時才設定
                this.bubbleScale = Math.max(2, Math.round(sizeScale * 3));
                this.bubble = document.createElement('img');
                this.bubble.className = 'bubble';
                this.bubble.style.display = 'none';
                this.bubbleName = null;   // 目前顯示的圖案（換邊重擺時要重新取圖）
                this.bubbleSide = 0;      // 目前擺在哪一側（1 右 / -1 左），要換邊才重擺
                this.bubbleLocked = false; // 保護期：期間內不被其他心情覆蓋（色違登場用）
                this.el.appendChild(this.bubble);

                this.el.appendChild(this.img);

                // 點擊互動：戳一下就開心跳一下 + 冒愛心（cursor: pointer 終於名符其實）。
                // OBS 可用來源的「互動」視窗戳；iframe 預設 pointer-events: none 點不到，
                // 想開放給訪客要自行拿掉（取捨見 README）
                this.jumpY = 0; // 點擊跳躍目前的離地高度（與走路跳步疊加）
                this.jumpV = 0; // 點擊跳躍的垂直速度
                this.el.addEventListener('click', () => this.poke());

                this.container.appendChild(this.el);

                // 初始化渲染
                this.updateDOM();

                // 色違登場儀式：一出場必定亮出金色閃光（不吃 bubbleChance 機率，
                // 但尊重 bubblePosition=none 的全域關閉），4 秒後自動收起。
                // 這個閃光同樣是一種心情表達，且是色違的專屬署名，所以整段期間上鎖：
                // 登場後隨即發呆（或被戳）不會把它瞬間換成別的心情、也不會提前收走。
                // 星星特效等圖片載入、本體現身那一刻再炸開，儀式感才對得上
                if (this.isShiny) {
                    this.showEmote('sparkle', 4000, true);
                    this.img.addEventListener('load', () => this.celebrateShiny(), { once: true });
                }
            }

            // 每一幀的邏輯更新 (Update Loop)
            update(deltaTime, others) {
                if (this.avoidCooldown > 0) this.avoidCooldown -= deltaTime;

                // 點擊跳躍：初速 + 重力的迷你拋物線，和走路跳步（|sin| 波）各自獨立計算
                if (this.jumpV !== 0 || this.jumpY > 0) {
                    const dt = deltaTime / (1000 / 60);
                    this.jumpY += this.jumpV * dt;
                    this.jumpV -= 0.4 * dt; // 重力
                    if (this.jumpY <= 0) { this.jumpY = 0; this.jumpV = 0; }
                }

                if (this.state === 'WALKING') {
                    this.walk(deltaTime);
                    this.avoidCrowding(others);
                } else if (this.state === 'IDLE') {
                    this.idle(deltaTime);
                }

                // 邊界檢查：只能在 bounds 指定的 X 軸比例區間內活動。
                // 每一幀都用「當下的」視窗寬度計算，所以視窗縮放時會自動修正
                const width = this.img.offsetWidth || CONFIG.baseSize * this.sizeScale;
                const minX = window.innerWidth * CONFIG.bounds.min;
                const maxX = window.innerWidth * CONFIG.bounds.max - width; // 扣掉自身寬度，右緣不超線
                if (maxX <= minX) {
                    // 活動範圍窄到塞不下自己（大體型 + 窄範圍的組合）：
                    // 釘在左界原地踏步。若放任兩個夾點互相彈，會每幀翻面抖動
                    this.x = minX;
                } else if (this.x < minX) {
                    this.x = minX;
                    this.direction = 1; // 撞到左邊界回頭
                } else if (this.x > maxX) {
                    this.x = maxX;
                    this.direction = -1; // 撞到右邊界回頭
                }

                this.updateDOM();
            }

            walk(deltaTime) {
                // 以 60fps 為基準做時間校正，移動速度不受螢幕更新率影響
                const dt = deltaTime / (1000 / 60);
                this.x += this.speed * this.direction * dt;

                // 用 |sin| 波模擬小跳步，速度越快的跳越頻繁
                this.walkPhase += deltaTime * CONFIG.hopFrequency * (this.speed / CONFIG.baseSpeed);
                this.bobY = Math.abs(Math.sin(this.walkPhase)) * this.hopHeight;

                // 隨機決定是否停下來看鏡頭
                if (Math.random() < CONFIG.idleChance) {
                    this.state = 'IDLE';
                    // 設定發呆時間
                    this.idleTimer = randomInt(CONFIG.lookTime.min, CONFIG.lookTime.max);
                    this.maybeShowEmote();
                }
            }

            // 顯示指定的心情對話框（尊重 bubblePosition 的全域關閉）。
            // duration > 0：幾毫秒後自動收起（0 = 留到發呆結束才收）
            // lock：保護期，期間內不接受其他心情覆蓋、也不會被提前收起
            // 回傳是否真的顯示了
            showEmote(name, duration = 0, lock = false) {
                const mode = CONFIG.bubblePosition ?? 'side';
                if (mode === 'none') return false; // 嵌入方選擇完全關閉對話框
                if (this.bubbleLocked) return false; // 保護期中（色違登場的金色閃光還沒演完）
                clearTimeout(this.bubbleTimer); // 別讓前一個自動收起計時（點擊愛心）誤傷這次的對話框
                this.bubbleName = name;
                // 寬度 = 該圖案的框寬 × 整數倍率（框寬依內容而不同，如驚嘆號是瘦框）
                this.bubble.style.width = `${(EMOTE_ICONS[name].frameWidth ?? 20) * this.bubbleScale}px`;
                this.placeBubble();
                this.bubble.style.display = 'block';

                if (lock) this.bubbleLocked = true;
                if (duration > 0) {
                    this.bubbleTimer = setTimeout(() => {
                        this.bubbleLocked = false; // 保護期到此為止
                        this.hideEmote();
                    }, duration);
                }
                return true;
            }

            // 收起對話框（保護期內一律讓路，例如色違剛登場就結束發呆）
            hideEmote() {
                if (this.bubbleLocked) return;
                clearTimeout(this.bubbleTimer);
                this.bubble.style.display = 'none';
            }

            // side 模式的對話框寬度與空隙（都是純算術，可以每幀重算不碰 DOM）。
            // gap 的設定值是「點陣圖上的像素」，乘上放大倍率換成畫面 px；
            // 取整數避免半像素位移把點陣圖弄糊（負數代表往身體上疊）
            bubbleMetrics() {
                return {
                    width: (EMOTE_ICONS[this.bubbleName].frameWidth ?? 20) * this.bubbleScale,
                    gap: Math.round((CONFIG.bubbleSideGap ?? 2) * this.bubbleScale),
                };
            }

            // 對話框要放哪一側（回傳 1 = 右、-1 = 左）。
            // 原則上跟著面向，但「快出畫面就翻到內側」：頁面 overflow 是 hidden，
            // 貼著邊界的那隻若照面向擺，框會被畫面邊緣切掉半個。
            // 兩側都塞不下（視窗超窄）就維持面向，不要每幀左右彈跳
            desiredBubbleSide() {
                if ((CONFIG.bubblePosition ?? 'side') !== 'side') return this.direction;
                const { width, gap } = this.bubbleMetrics();
                const bodyW = this.img.offsetWidth || CONFIG.baseSize * this.sizeScale;
                const fitsRight = this.x + bodyW + gap + width <= window.innerWidth;
                const fitsLeft = this.x - gap - width >= 0;
                if (this.direction === 1 && !fitsRight && fitsLeft) return -1;
                if (this.direction === -1 && !fitsLeft && fitsRight) return 1;
                return this.direction;
            }

            // 擺位 + 尾巴朝向：
            // top  = 頭頂正上方（尾巴朝下，維持預設朝向）
            // side = 由 desiredBubbleSide() 決定的那一側斜上方，垂直錨在身高六成處。
            //        整個框推到本體邊界「之外」再留一點空隙——切齊或半重疊都會被
            //        大鉗蟹、鐵甲蛹這類寬體型蓋住；尾巴則鏡像成朝內指回本體
            //        （框在右側 → 尾巴朝左下）
            placeBubble(bubbleSide = this.desiredBubbleSide()) {
                const mode = CONFIG.bubblePosition ?? 'side';
                const side = mode === 'side';
                this.bubble.src = getEmoteURI(this.bubbleName, side ? -bubbleSide : 1);

                // 上下層：sprite 有 will-change: transform，會自成堆疊脈絡並被歸到
                // 「z-index: 0」那一階畫，又排在 bubble 之後，所以光靠 DOM 順序
                // 一定被它蓋掉——要用明確的正/負 z-index 才跨得過去
                this.bubble.style.zIndex = (CONFIG.bubbleLayer ?? 'front') === 'behind' ? -1 : 2;
                if (side) {
                    const { gap } = this.bubbleMetrics();
                    // 擺左側時要再往左退自己一個身（-100%）。gap 允許負數，
                    // 所以正負分開組字串，避免產生 calc(-100% - -6px) 這種雙負號
                    const back = gap >= 0 ? `- ${gap}px` : `+ ${-gap}px`;
                    this.bubble.style.left = bubbleSide === 1 ? '100%' : '0';
                    this.bubble.style.transform = bubbleSide === 1
                        ? `translateX(${gap}px)`
                        : `translateX(calc(-100% ${back}))`;
                    this.bubble.style.bottom = '60%';
                } else {
                    this.bubble.style.left = '50%';
                    this.bubble.style.transform = 'translateX(-50%)';
                    this.bubble.style.bottom = 'calc(100% + 2px)';
                }
                this.bubbleSide = bubbleSide; // 記住實際擺在哪側，換側時才動 DOM
            }

            // 起跳：拋物線小跳的共用入口（點擊互動與發呆亂跳都走這裡）
            jump() {
                this.jumpV = 4 * (0.7 + 0.3 * this.sizeScale); // 起跳初速，體型越大跳得越高
            }

            // 被點擊：小跳一下 + 冒愛心，1.6 秒後自動收起。
            // 走路中、發呆中、甚至半空中都可以戳（半空中再戳會重新起跳）。
            // 色違登場閃光的保護期內只跳、不換對話框
            poke() {
                this.jump();
                this.showEmote('heart', 1600);
            }

            // 色違登場的慶祝特效：一圈像素星星從本體中心向外炸開、漸淡。
            // 圖片載入後才觸發（本體現身的那一刻），星星本身用完即丟
            celebrateShiny() {
                const height = this.img.offsetHeight || CONFIG.baseSize * this.sizeScale;
                const colors = ['#ecb200', '#ffd84d']; // 星光金 × 亮金，同色系兩層次
                const count = 10;
                for (let i = 0; i < count; i++) {
                    const shape = i % 2 === 0 ? 'big' : 'small';
                    const star = document.createElement('img');
                    star.className = 'burst-star';
                    star.src = getStarURI(shape, colors[Math.floor(Math.random() * colors.length)]);
                    star.style.animationDuration = `${CONFIG.shinyBurstDuration ?? 1400}ms`;
                    const w = STAR_ARTS[shape][0].length * this.bubbleScale;
                    star.style.width = `${w}px`;
                    // 從本體中央出發：角度沿「上半弧」平均分佈再加小亂數
                    // （不取整圈：往正下方飛會立刻被頁面底邊裁掉），距離依體型放大
                    const angle = Math.PI * (-0.15 + 1.3 * (i / (count - 1))) + (Math.random() - 0.5) * 0.3;
                    const dist = (26 + Math.random() * 16) * (0.7 + this.sizeScale * 0.5);
                    star.style.left = `calc(50% - ${Math.round(w / 2)}px)`;
                    star.style.bottom = `${Math.round(height * 0.5)}px`;
                    star.style.setProperty('--dx', `${Math.round(Math.cos(angle) * dist)}px`);
                    star.style.setProperty('--dy', `${Math.round(-Math.sin(angle) * dist)}px`);
                    star.addEventListener('animationend', () => star.remove());
                    this.el.appendChild(star);
                }
            }

            // 只有站定發呆時才有機會冒心情對話框；走路中不觸發
            maybeShowEmote() {
                if (Math.random() >= (CONFIG.bubbleChance ?? 0.5)) return;
                const names = Object.keys(EMOTE_ICONS);
                this.showEmote(names[randomInt(0, names.length - 1)]);
            }

            // 行進方向的前方太近有同伴就掉頭；掉頭後進入冷卻，
            // 避免在牆角或人群中來回抖動
            avoidCrowding(others) {
                if (this.avoidCooldown > 0) return;
                for (const other of others) {
                    if (other === this) continue;
                    const dx = other.x - this.x;
                    if (Math.abs(dx) < CONFIG.personalSpace && Math.sign(dx) === this.direction) {
                        this.direction *= -1;
                        this.avoidCooldown = randomInt(1500, 3000);
                        break;
                    }
                }
            }

            idle(deltaTime) {
                // 發呆時緩緩落回地面，不要硬生生定格在半空中
                this.bobY *= 0.8;
                if (this.bobY < 0.1) this.bobY = 0;

                // 發呆亂跳：站穩在地上時，機率性原地開心跳一下
                // （落地才擲骰，不會在半空中連鎖二段跳）
                if (this.jumpY === 0 && this.jumpV === 0
                    && Math.random() < (CONFIG.idleJumpChance ?? 0)) {
                    this.jump();
                }

                this.idleTimer -= deltaTime;
                if (this.idleTimer <= 0) {
                    this.state = 'WALKING';
                    this.hideEmote(); // 開始走路就收起對話框（保護期中的閃光除外）
                    // 隨機決定是否轉向
                    if (Math.random() > 0.5) {
                        this.direction *= -1;
                    }
                }
            }

            updateDOM() {
                // 位置（container）與翻面（sprite 圖片）分開處理：
                // - 位置每一幀都在變，直接設定、不套緩動，才不會有飄移感
                // - 翻面用「瞬間鏡像」，補間 scaleX 會經過 0 導致被壓扁成一條線
                //   （2D 像素遊戲的角色轉向本來就是瞬間翻面，這樣反而最自然）
                this.el.style.transform = `translate3d(${this.x}px, 0, 0)`;

                // 對話框顯示中要換邊時（轉向、或走到畫面邊緣得翻到內側），
                // 跟著換邊並鏡像尾巴。判斷純算術，同一側就不動 DOM
                if (this.bubbleName && this.bubble.style.display !== 'none') {
                    const bubbleSide = this.desiredBubbleSide();
                    if (bubbleSide !== this.bubbleSide) this.placeBubble(bubbleSide);
                }

                // 原圖面向左邊：direction 1 (向右) -> scaleX(-1) 鏡像
                const scale = this.direction === 1 ? -1 : 1;
                const lift = this.bobY + this.jumpY; // 走路跳步 + 點擊跳躍疊加後的離地高度
                this.img.style.transform = `scaleX(${scale}) translateY(${-lift}px)`;

                // 跳起來時影子縮小、變淡，強化離地的感覺
                // （走路跳步以自身跳高為滿格；點擊跳躍以 20px 為滿格，取較高者）
                const airRatio = Math.min(Math.max(this.bobY / this.hopHeight, this.jumpY / 20), 1);
                this.shadow.style.transform = `translateX(-50%) scale(${1 - airRatio * 0.3})`;
                this.shadow.style.opacity = 1 - airRatio * 0.4;

                // 調整 Z-index 根據 X 軸位置（避免負值造成排序問題）
                this.el.style.zIndex = Math.max(0, Math.floor(this.x));
            }
        }

        // ---------------------------------------------------------
        // 主程式邏輯 (Main)
        // ---------------------------------------------------------
        const app = document.getElementById('app');
        const pokemons = [];
        let lastTime = 0;

        async function init() {
            // URL 有帶 ?ids= 就用固定清單，否則照 count/minId/maxId 隨機抽
            const ids = CONFIG.fixedIds ?? getUniqueRandomIds(CONFIG.count, CONFIG.minId, CONFIG.maxId);

            // 先向 PokéAPI 查每隻的身高，決定體型分級（並行查詢）
            const scales = await Promise.all(ids.map(getSizeScale));

            // 實例化 Pokemon（index 同時當作出生跑道編號）
            ids.forEach((id, i) => {
                pokemons.push(new Pokemon(id, app, scales[i], i));
            });

            // 啟動動畫迴圈
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            // 限制 deltaTime 上限：避免切換分頁再回來時瞬間跳一大步
            const deltaTime = Math.min(timestamp - lastTime, 100);
            lastTime = timestamp;

            pokemons.forEach(p => p.update(deltaTime, pokemons));

            requestAnimationFrame(gameLoop);
        }

        // 視窗大小改變不需要另外監聽：
        // update() 的邊界檢查每一幀都會用當下的視窗寬度重新計算

        // 啟動！（找不到設定檔就不啟動，並在主控台提示）
        if (CONFIG) {
            applyQueryOverrides(CONFIG);
            init();
        } else {
            console.error('[PokéFooter] 找不到 window.POKE_CONFIG，請確認 config.js 與本 HTML 放在同一個資料夾。');
        }

    </script>
</body>
</html>
