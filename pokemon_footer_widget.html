        // 把圖示疊進對話框、畫到 canvas，回傳 dataURL
        // （同圖案 × 同尾巴朝向只畫一次，之後走快取）
        const emoteCache = {};
        function getEmoteURI(name, tailDir = 1) {
            const key = `${name}:${tailDir}`;
            if (emoteCache[key]) return emoteCache[key];
            const icon = EMOTE_ICONS[name];
            // 內部列數自動配合圖案高度（上下各留 2px 白邊），最少維持 12
            const innerRows = Math.max(12, icon.art.length + 4);
            const rows = buildBubbleFrame(icon.frameWidth ?? 20, innerRows, tailDir).map((row, r) => {
                const overlay = icon.art[r - icon.top];
                if (!overlay) return row;
                const patched = [...overlay].map((ch, i) => ch === '.' ? row[icon.left + i] : ch).join('');
                return row.slice(0, icon.left) + patched + row.slice(icon.left + overlay.length);
            });
            const canvas = document.createElement('canvas');
            canvas.width = rows[0].length;
            canvas.height = rows.length;
            const ctx = canvas.getContext('2d');
            rows.forEach((row, y) => [...row].forEach((ch, x) => {
                if (EMOTE_PALETTE[ch]) {
                    ctx.fillStyle = EMOTE_PALETTE[ch];
                    ctx.fillRect(x, y, 1, 1);
                }
            }));
            return emoteCache[key] = canvas.toDataURL();
        }

        // ---------------------------------------------------------
        // 色違登場的星星粒子 (Shiny Burst)
        // 兩種尺寸的像素四芒星 × 兩種金色，canvas 畫一次就快取
        // ---------------------------------------------------------
        const STAR_ARTS = {
            big:   ['..y..', '.yyy.', 'yyyyy', '.yyy.', '..y..'],
            small: ['.y.', 'yyy', '.y.'],
        };
        const starCache = {};
        function getStarURI(shape, color) {
            const key = `${shape}:${color}`;
            if (starCache[key]) return starCache[key];
            const art = STAR_ARTS[shape];
            const canvas = document.createElement('canvas');
            canvas.width = art[0].length;
            canvas.height = art.length;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            art.forEach((row, y) => [...row].forEach((ch, x) => {
                if (ch === 'y') ctx.fillRect(x, y, 1, 1);
            }));
            return starCache[key] = canvas.toDataURL();
        }

        // ---------------------------------------------------------
        // 樹果的像素圖 (Berry Sprite)
        // 參考文柚果的 Bag Sprite：金黃梨形 + 頂上一片綠葉，
        // 12×14 點陣、canvas 畫一次就快取，一樣不吃外部素材
        // ---------------------------------------------------------
        const BERRY_SCALE = 2; // 顯示放大倍率（整數，維持點陣感）
        const BERRY_ART = [
            '......kk....',
            '.....ks.....',
            '..kk.ks.....',
            '.kLlkks.....',
            '.kllLkkk....',
            '..kkkyYk....',
            '...kYyyyk...',
            '..kYYyyydk..',
            '..kYyyyydk..',
            '.kYyyyyyddk.',
            '.kyyyyyyddk.',
            '.kyyyyyddk..',
            '..kyyyddk...',
            '...kkkkk....',
        ];
        const BERRY_PALETTE = {
            k: '#4a3214', // 墨線：深褐
            s: '#8a5a2b', // 果蒂
            l: '#7ac74c', // 葉片亮綠
            L: '#4e8f34', // 葉片暗綠
            y: '#f5c435', // 果身金黃
            Y: '#fbe98c', // 受光面
            d: '#c9952b', // 背光面
        };
        let berryURICache = null;
        function getBerryURI() {
            if (berryURICache) return berryURICache;
            const canvas = document.createElement('canvas');
            canvas.width = BERRY_ART[0].length;
            canvas.height = BERRY_ART.length;
            const ctx = canvas.getContext('2d');
            BERRY_ART.forEach((row, y) => [...row].forEach((ch, x) => {
                if (BERRY_PALETTE[ch]) {
                    ctx.fillStyle = BERRY_PALETTE[ch];
                    ctx.fillRect(x, y, 1, 1);
                }
            }));
            return berryURICache = canvas.toDataURL();
        }

        // ---------------------------------------------------------
        // 主題地面 (Themed Ground)
        // theme 參數開啟後，在頁面最底鋪一條像素地面，讓散步有地方踩。
        // 貼片是載入時即場生成：頂緣墨線 + 亮色 + 底色，再隨機灑斑點與
        // 小圖章（花、貝殼、裂縫…），每次重新整理的地面都長得不太一樣。
        // 一樣是 canvas → dataURL，不吃任何外部素材。
        // inset = 腳掌「踩進」表面的深度（點陣 px）：
        // 草會蓋到腳邊、雪會陷進去、水會泡到小腿，岩地就只是站在上面
        // ---------------------------------------------------------
        const GROUND_SCALE = 2;      // 顯示放大倍率（整數，維持點陣感）
        const GROUND_TILE_W = 256;   // 貼片寬（點陣 px），夠寬就看不出重複
        // 貼片高不再寫死：由 CONFIG.themeHeight（畫面 px）換算成列數，見 initGround
        const GROUND_THEMES = {
            grass: {
                inset: 3,
                top: ['#245c31', '#8ee06a'],
                fill: '#47a04f',
                speckles: [{ color: '#2c6e35', density: 0.06 }, { color: '#8ee06a', density: 0.03 }],
                stamps: [
                    { avg: 40, colors: { w: '#ffffff', y: '#ecb200' }, art: ['w.w', '.y.', 'w.w'] }, // 小白花
                    { avg: 28, colors: { g: '#2c6e35' }, art: ['g.g', 'g.g'] },                      // 草叢短枝
                ],
            },
            water: {
                inset: 5,
                flow: 16,
                top: ['#1b4a7a', '#d8f1ff'],
                fill: '#3f7fd4',
                speckles: [{ color: '#6faae8', density: 0.05 }, { color: '#2c62ad', density: 0.04 }],
                stamps: [
                    { avg: 36, colors: { w: '#d8f1ff' }, art: ['ww..', '..ww'] }, // 波光
                ],
            },
            snow: {
                inset: 4,
                top: ['#8fa8bd', '#ffffff'],
                fill: '#edf5fb',
                speckles: [{ color: '#d7e7f2', density: 0.06 }, { color: '#ffffff', density: 0.04 }],
                stamps: [
                    { avg: 48, colors: { u: '#b7d4e8' }, art: ['.u.', 'u.u', '.u.'] }, // 冰晶
                ],
            },
            sand: {
                inset: 2,
                top: ['#a9803c', '#f7dfa0'],
                fill: '#e8c979',
                speckles: [{ color: '#cfa855', density: 0.06 }, { color: '#f7e7b3', density: 0.04 }],
                stamps: [
                    { avg: 56, colors: { w: '#fff6e0', d: '#b08a45' }, art: ['.ww.', 'wwdw', '.dd.'] }, // 小貝殼
                ],
            },
            rock: {
                inset: 1,
                top: ['#3f3f46', '#a8a8b0'],
                fill: '#7d7d86',
                speckles: [{ color: '#5f5f68', density: 0.06 }, { color: '#96969e', density: 0.04 }],
                stamps: [
                    { avg: 44, colors: { d: '#4c4c54' }, art: ['d..', '.d.', '..d'] },          // 裂縫
                    { avg: 60, colors: { l: '#b8b8c0', d: '#5f5f68' }, art: ['.ll.', 'lldd'] }, // 碎石
                ],
            },
            dirt: {
                inset: 2,
                top: ['#57390f', '#c89a5b'],
                fill: '#9a6b38',
                speckles: [{ color: '#7c5426', density: 0.06 }, { color: '#c89a5b', density: 0.03 }],
                stamps: [
                    { avg: 52, colors: { l: '#b9b2a6', d: '#6e6357' }, art: ['ll', 'dd'] }, // 小石子
                ],
            },
            lava: {
                inset: 1,
                flow: 40,
                top: ['#2a1512', '#ff9b2f'],
                fill: '#45231d',
                speckles: [
                    { color: '#ff6b1a', density: 0.05 },
                    { color: '#ffc63f', density: 0.02 },
                    { color: '#2a1512', density: 0.05 },
                ],
                stamps: [
                    { avg: 30, colors: { o: '#ff8c1a' }, art: ['oo..', '..oo'] }, // 岩縫火光
                ],
            },
        };

        // 生成主題貼片，回傳 dataURL（GROUND_TILE_W × artH 點陣 px）
        function buildGroundTexture(theme, artH) {
            const canvas = document.createElement('canvas');
            canvas.width = GROUND_TILE_W;
            canvas.height = artH;
            const ctx = canvas.getContext('2d');
            theme.top.forEach((color, y) => {
                ctx.fillStyle = color;
                ctx.fillRect(0, y, GROUND_TILE_W, 1);
            });
            ctx.fillStyle = theme.fill;
            ctx.fillRect(0, theme.top.length, GROUND_TILE_W, artH - theme.top.length);
            for (const s of theme.speckles ?? []) {
                const n = Math.round(GROUND_TILE_W * (artH - theme.top.length) * s.density);
                ctx.fillStyle = s.color;
                for (let i = 0; i < n; i++) {
                    ctx.fillRect(randomInt(0, GROUND_TILE_W - 1), randomInt(theme.top.length, artH - 1), 1, 1);
                }
            }
            for (const st of theme.stamps ?? []) {
                // 地面矮到塞不下的圖章直接跳過（超低 themeHeight 時只留斑點質感）
                if (artH - theme.top.length < st.art.length) continue;
                const n = Math.max(1, Math.round(GROUND_TILE_W / st.avg));
                for (let i = 0; i < n; i++) {
                    const ox = randomInt(0, GROUND_TILE_W - st.art[0].length);
                    const oy = randomInt(theme.top.length, artH - st.art.length);
                    st.art.forEach((row, y) => [...row].forEach((ch, x) => {
                        if (st.colors[ch]) {
                            ctx.fillStyle = st.colors[ch];
                            ctx.fillRect(ox + x, oy + y, 1, 1);
                        }
                    }));
                }
            }
            return canvas.toDataURL();
        }

        // 鋪地面。回傳寶可夢要抬高的量（畫面 px）= 地面高度 - 踩入深度。
        // theme 不存在（none / 打錯字）就不鋪、回傳 0，一切維持原樣
        function initGround(themeName) {
            const theme = GROUND_THEMES[themeName];
            if (!theme) return 0;
            // 高度以畫面 px 指定（themeHeight），內部換成 2px 像素格的列數，
            // 所以實際高度會取到最接近的偶數；最少 3 列（頂緣 2 列 + 至少 1 列底）
            const artH = Math.max(3, Math.round((CONFIG.themeHeight ?? 12) / GROUND_SCALE));
            const displayH = artH * GROUND_SCALE;
            const ground = document.createElement('div');
            ground.id = 'ground';
            ground.style.height = `${displayH}px`;
            ground.style.backgroundImage = `url(${buildGroundTexture(theme, artH)})`;
            ground.style.backgroundSize = `${GROUND_TILE_W * GROUND_SCALE}px ${displayH}px`;
            if (theme.flow) {
                // 水與熔岩緩慢橫向流動：一輪位移剛好一張貼片寬，無縫循環
                ground.className = 'ground-flow';
                ground.style.setProperty('--flow-width', `-${GROUND_TILE_W * GROUND_SCALE}px`);
                ground.style.setProperty('--flow-duration', `${theme.flow}s`);
            }
            app.appendChild(ground);
            return Math.max(0, displayH - theme.inset * GROUND_SCALE);
        }

        // ---------------------------------------------------------
        // 寶可夢類別 (Pokemon Class)
        // 這就像是用 Golang 定義一個 Struct，包含狀態與行為
        // ---------------------------------------------------------
        // 寒暄站位時，兩隻身體邊緣之間留的空隙（畫面 px）
        const GREET_GAP = 16;
        // 被抓在手上時的掙扎動畫：擺動的基礎相位速度（rad/ms）與最大傾角（度）。
        // GIF 的播放速率瀏覽器不給控制，「掙扎得多快」就靠這兩個值 × dragStruggleRate
        const STRUGGLE_FREQ = 0.012;
        const STRUGGLE_TILT = 10;

        class Pokemon {
            constructor(id, container, sizeScale, laneIndex, groundLift = 0) {
                this.id = id;
                this.container = container;
                this.sizeScale = sizeScale;

                // 狀態屬性
                // 出生點：把「允許活動範圍」(bounds) 分成 count 條跑道，
                // 每隻站在自己跑道的中心點，再加 ±20% 跑道寬的小抖動。
                // 相鄰間距至少保有 60% 跑道寬，出生時絕不重疊；
                // 抖動則避免完美等距的「閱兵感」。
                // （取跑道中心而非頭尾等分點：count = 1 不會除以零，
                //   頭尾兩隻也不會貼著邊界出生、下一幀就觸發撞牆掉頭）
                const roamMin = window.innerWidth * CONFIG.bounds.min;
                const roamWidth = window.innerWidth * (CONFIG.bounds.max - CONFIG.bounds.min);
                const laneWidth = roamWidth / CONFIG.count;
                const jitter = (Math.random() - 0.5) * laneWidth * 0.4;
                this.x = roamMin + (laneIndex + 0.5) * laneWidth + jitter;
                this.direction = Math.random() > 0.5 ? 1 : -1; // 1: 向右, -1: 向左
                this.state = 'WALKING'; // WALKING | IDLE
                this.speed = CONFIG.baseSpeed + Math.random() * CONFIG.speedVariance; // 隨機速度差異
                this.idleTimer = 0;
                this.avoidCooldown = 0; // 因避讓而掉頭後的冷卻時間
                this.targetBerry = null; // 正在追的那顆果實（一隻只追一顆）
                this.greetPartner = null; // 正在寒暄的對象（偶遇打招呼）
                this.greetTimer = 0;
                this.greetCooldown = 0; // 寒暄後的冷卻：同一對不會在原地無限寒暄

                // 走路跳步動畫（GIF 本身只有原地待機動畫，沒有腳步，
                // 補上垂直的小跳躍才不會像滑行）
                this.walkPhase = Math.random() * Math.PI * 2; // 隨機起始相位，避免大家同步跳
                // 每隻跳的高度略有不同，體型越小跳得越低
                this.hopHeight = (CONFIG.hopHeight + Math.random() * CONFIG.hopVariance)
                                 * (0.6 + sizeScale * 0.6);
                this.bobY = 0; // 目前離地高度

                // DOM 元素建立
                this.el = document.createElement('div');
                this.el.className = 'pokemon-container';
                // 有主題地面時整個容器抬高，站上地面的表面
                // （影子、對話框、星星都在容器裡，會一起跟上去）
                if (groundLift) this.el.style.bottom = `${groundLift}px`;

                // 陰影（保留參考，跳起來時要縮小它）。
                // 寬度以「圖片實際顯示寬度」為準，讓影子跟寶可夢差不多寬；
                // 圖片載入前先用體型估一個過渡值。
                // 顏色依主屬性染色（暗色系），查不到屬性就用預設黑影
                this.shadow = document.createElement('div');
                this.shadow.className = 'shadow';
                this.shadow.style.width = `${Math.round(48 * sizeScale + 8)}px`;
                const primaryType = window.POKE_TYPES ? window.POKE_TYPES[id] : undefined;
                this.shadow.style.background =
                    CONFIG.typeShadowColors?.[primaryType] || CONFIG.typeShadowColors?.default
                    || 'rgba(0, 0, 0, 0.2)';
                this.el.appendChild(this.shadow);

                // 色違判定：每一隻「獨立」擲骰，不是一次骰全體
                this.isShiny = Math.random() < (CONFIG.shinyChance ?? 0);
                const shinyDir = this.isShiny ? 'shiny/' : '';

                // 圖片：高度依體型分級縮放（寬度 auto，會等比例跟著縮）
                this.img = document.createElement('img');
                this.img.className = 'sprite';
                this.img.style.height = `${Math.round(CONFIG.baseSize * sizeScale)}px`;
                // 使用 PokéAPI 的 GitHub Raw 資源庫，這是第五世代的動態 GIF，非常可愛
                // （色違版只差一層 shiny/ 目錄，動圖與靜圖皆同）
                this.img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${shinyDir}${this.id}.gif`;

                // 載入失敗處理 (有些稀有 ID 可能沒有動圖)。
                // 備援只有一次機會：觸發時先換掛「最終防線」再換圖，
                // 靜態圖也失敗（網路異常、來源被擋）就整隻隱藏，
                // 不露瀏覽器的破圖示，也杜絕 onerror 反覆觸發的重試迴圈
                this.img.onerror = () => {
                    this.img.onerror = () => {
                        this.img.onerror = null;
                        this.el.style.display = 'none';
                    };
                    // 動圖失敗，退回使用一般靜態圖（色違同樣有 shiny/ 靜態圖）
                    this.img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${shinyDir}${this.id}.png`;
                };

                // 圖片載入後把影子寬度對齊「實際顯示寬度 × shadowWidthRatio」
                // （換成備援圖時 load 會再觸發一次，寬度自動跟著重算）
                this.img.addEventListener('load', () => {
                    if (this.img.offsetWidth) {
                        const ratio = CONFIG.shadowWidthRatio ?? 0.9;
                        this.shadow.style.width = `${Math.round(this.img.offsetWidth * ratio)}px`;
                    }
                });

                // 心情對話框（發呆時隨機冒出）。
                // 放大倍率取整數，像素才不會被非整數縮放糊掉：小體型 2x、大體型 3x。
                // 顯示寬度依各圖案的框寬而定，在 maybeShowEmote 時才設定
                this.bubbleScale = Math.max(2, Math.round(sizeScale * 3));
                this.bubble = document.createElement('img');
                this.bubble.className = 'bubble';
                this.bubble.style.display = 'none';
                this.bubbleName = null;   // 目前顯示的圖案（換邊重擺時要重新取圖）
                this.bubbleSide = 0;      // 目前擺在哪一側（1 右 / -1 左），要換邊才重擺
                this.bubbleLocked = false; // 保護期：期間內不被其他心情覆蓋（色違登場用）
                this.el.appendChild(this.bubble);

                this.el.appendChild(this.img);

                // 滑鼠互動（三種按法各司其職，見「滑鼠拖曳」一節的分流表）。
                // OBS 可用來源的「互動」視窗玩；iframe 預設 pointer-events: none 點不到，
                // 想開放給訪客要自行拿掉（取捨見 README）
                this.jumpY = 0; // 點擊跳躍目前的離地高度（與走路跳步疊加）
                this.jumpV = 0; // 點擊跳躍的垂直速度
                this.holdY = 0; // 被抓在手上時的離地高度（見「滑鼠拖曳」一節）
                this.struggleAngle = 0; // 掙扎中的傾角（度）
                this.grabDX = 0; // 抓起來那一刻，游標與身體左緣／地面的相對位置
                this.grabDY = 0;
                // 左鍵按下去的那一刻就抓起來——沒有長按門檻，游標不會先跑掉一段
                this.el.addEventListener('pointerdown', e => beginDrag(this, e));
                // 右鍵：擋掉系統選單（「另存圖片」），改演戳戳互動。
                // 行動裝置的長按也會送 contextmenu，但那時牠已經在手上了，
                // poke() 的 HELD 防護會擋下來，不會抓著又被戳
                this.el.addEventListener('contextmenu', e => {
                    e?.preventDefault?.();
                    this.poke();
                });
                // 本體上的左鍵 click 到此為止：別冒泡到 document——
                // 那裡掛著「點空白處丟果實」，點到身上不該掉果實
                this.el.addEventListener('click', e => e?.stopPropagation());
                // sprite 是 <img>，瀏覽器預設可以被原生拖放（會拖出一張半透明鬼影，
                // 蓋掉我們自己的拖曳、放開手還會被當成外部檔案），直接擋掉
                this.img.addEventListener('dragstart', e => e?.preventDefault?.());

                this.container.appendChild(this.el);

                // 初始化渲染
                this.updateDOM();

                // 色違登場儀式：一出場必定亮出金色閃光（不吃 bubbleChance 機率，
                // 但尊重 bubblePosition=none 的全域關閉），4 秒後自動收起。
                // 這個閃光同樣是一種心情表達，且是色違的專屬署名，所以整段期間上鎖：
                // 登場後隨即發呆（或被戳）不會把它瞬間換成別的心情、也不會提前收走。
                // 星星特效等圖片載入、本體現身那一刻再炸開，儀式感才對得上
                if (this.isShiny) {
                    this.showEmote('sparkle', 4000, true);
                    this.img.addEventListener('load', () => this.celebrateShiny(), { once: true });
                }
            }

            // 每一幀的邏輯更新 (Update Loop)
            update(deltaTime, others) {
                if (this.avoidCooldown > 0) this.avoidCooldown -= deltaTime;
                if (this.greetCooldown > 0) this.greetCooldown -= deltaTime;

                // 點擊跳躍：初速 + 重力的迷你拋物線，和走路跳步（|sin| 波）各自獨立計算
                if (this.jumpV !== 0 || this.jumpY > 0) {
                    const dt = deltaTime / (1000 / 60);
                    this.jumpY += this.jumpV * dt;
                    this.jumpV -= 0.4 * dt; // 重力
                    if (this.jumpY <= 0) { this.jumpY = 0; this.jumpV = 0; }
                }

                if (this.state === 'HELD') {
                    // 在手上：位置由游標決定，這裡只演掙扎
                    this.struggle(deltaTime);
                } else if (this.state === 'WALKING') {
                    this.walk(deltaTime);
                    this.avoidCrowding(others);
                } else if (this.state === 'IDLE') {
                    this.idle(deltaTime);
                } else if (this.state === 'GREETING') {
                    this.greet(deltaTime);
                } else if (this.state === 'SEEK_BERRY') {
                    this.seekBerry(deltaTime);
                } else if (this.state === 'EATING') {
                    this.eatBerry(deltaTime);
                } else if (this.state === 'FEED_HEART') {
                    // 吃完的餘韻：愛心演完這隻的餵食才算結束
                    this.bobY *= 0.8;
                    this.heartTimer -= deltaTime;
                    if (this.heartTimer <= 0) {
                        this.state = 'WALKING'; // 忙完了，之後才會發現下一顆果實
                    }
                }

                // 邊界檢查：只能在 bounds 指定的 X 軸比例區間內活動。
                // 每一幀都用「當下的」視窗寬度計算，所以視窗縮放時會自動修正
                const width = this.img.offsetWidth || CONFIG.baseSize * this.sizeScale;
                const minX = window.innerWidth * CONFIG.bounds.min;
                const maxX = window.innerWidth * CONFIG.bounds.max - width; // 扣掉自身寬度，右緣不超線
                if (maxX <= minX) {
                    // 活動範圍窄到塞不下自己（大體型 + 窄範圍的組合）：
                    // 釘在左界原地踏步。若放任兩個夾點互相彈，會每幀翻面抖動
                    this.x = minX;
                } else if (this.x < minX) {
                    this.x = minX;
                    // 撞到左邊界回頭。被抓著的那隻不轉向：游標拉出界時牠是
                    // 貼著邊界繼續掙扎，每幀翻面會抖成一團
                    if (this.state !== 'HELD') this.direction = 1;
                } else if (this.x > maxX) {
                    this.x = maxX;
                    if (this.state !== 'HELD') this.direction = -1; // 撞到右邊界回頭
                }

                this.updateDOM();
            }

            walk(deltaTime) {
                // 以 60fps 為基準做時間校正，移動速度不受螢幕更新率影響
                const dt = deltaTime / (1000 / 60);
                this.x += this.speed * this.direction * dt;

                // 用 |sin| 波模擬小跳步，速度越快的跳越頻繁
                this.walkPhase += deltaTime * CONFIG.hopFrequency * (this.speed / CONFIG.baseSpeed);
                this.bobY = Math.abs(Math.sin(this.walkPhase)) * this.hopHeight;

                // 隨機決定是否停下來看鏡頭
                if (Math.random() < CONFIG.idleChance) {
                    this.state = 'IDLE';
                    // 設定發呆時間
                    this.idleTimer = randomInt(CONFIG.lookTime.min, CONFIG.lookTime.max);
                    this.maybeShowEmote();
                }
            }

            // 顯示指定的心情對話框（尊重 bubblePosition 的全域關閉）。
            // duration > 0：幾毫秒後自動收起（0 = 留到發呆結束才收）
            // lock：保護期，期間內不接受其他心情覆蓋、也不會被提前收起
            // 回傳是否真的顯示了
            showEmote(name, duration = 0, lock = false) {
                const mode = CONFIG.bubblePosition ?? 'side';
                if (mode === 'none') return false; // 嵌入方選擇完全關閉對話框
                if (this.bubbleLocked) return false; // 保護期中（色違登場的金色閃光還沒演完）
                clearTimeout(this.bubbleTimer); // 別讓前一個自動收起計時（點擊愛心）誤傷這次的對話框
                this.bubbleName = name;
                // 寬度 = 該圖案的框寬 × 整數倍率（框寬依內容而不同，如驚嘆號是瘦框）
                this.bubble.style.width = `${(EMOTE_ICONS[name].frameWidth ?? 20) * this.bubbleScale}px`;
                this.placeBubble();
                this.bubble.style.display = 'block';

                if (lock) this.bubbleLocked = true;
                if (duration > 0) {
                    this.bubbleTimer = setTimeout(() => {
                        this.bubbleLocked = false; // 保護期到此為止
                        this.hideEmote();
                    }, duration);
                }
                return true;
            }

            // 收起對話框（保護期內一律讓路，例如色違剛登場就結束發呆）
            hideEmote() {
                if (this.bubbleLocked) return;
                clearTimeout(this.bubbleTimer);
                this.bubble.style.display = 'none';
            }

            // side 模式的對話框寬度與空隙（都是純算術，可以每幀重算不碰 DOM）。
            // gap 的設定值是「點陣圖上的像素」，乘上放大倍率換成畫面 px；
            // 取整數避免半像素位移把點陣圖弄糊（負數代表往身體上疊）
            bubbleMetrics() {
                return {
                    width: (EMOTE_ICONS[this.bubbleName].frameWidth ?? 20) * this.bubbleScale,
                    gap: Math.round((CONFIG.bubbleSideGap ?? 2) * this.bubbleScale),
                };
            }

            // 對話框要放哪一側（回傳 1 = 右、-1 = 左）。
            // 原則上跟著面向，但「快出畫面就翻到內側」：頁面 overflow 是 hidden，
            // 貼著邊界的那隻若照面向擺，框會被畫面邊緣切掉半個。
            // 兩側都塞不下（視窗超窄）就維持面向，不要每幀左右彈跳
            desiredBubbleSide() {
                if ((CONFIG.bubblePosition ?? 'side') !== 'side') return this.direction;
                const { width, gap } = this.bubbleMetrics();
                const bodyW = this.img.offsetWidth || CONFIG.baseSize * this.sizeScale;
                const fitsRight = this.x + bodyW + gap + width <= window.innerWidth;
                const fitsLeft = this.x - gap - width >= 0;
                if (this.direction === 1 && !fitsRight && fitsLeft) return -1;
                if (this.direction === -1 && !fitsLeft && fitsRight) return 1;
                return this.direction;
            }

            // 擺位 + 尾巴朝向：
            // top  = 頭頂正上方（尾巴朝下，維持預設朝向）
            // side = 由 desiredBubbleSide() 決定的那一側斜上方，垂直錨在身高六成處。
            //        整個框推到本體邊界「之外」再留一點空隙——切齊或半重疊都會被
            //        大鉗蟹、鐵甲蛹這類寬體型蓋住；尾巴則鏡像成朝內指回本體
            //        （框在右側 → 尾巴朝左下）
            placeBubble(bubbleSide = this.desiredBubbleSide()) {
                const mode = CONFIG.bubblePosition ?? 'side';
                const side = mode === 'side';
                this.bubble.src = getEmoteURI(this.bubbleName, side ? -bubbleSide : 1);

                // 上下層：sprite 有 will-change: transform，會自成堆疊脈絡並被歸到
                // 「z-index: 0」那一階畫，又排在 bubble 之後，所以光靠 DOM 順序
                // 一定被它蓋掉——要用明確的正/負 z-index 才跨得過去
                this.bubble.style.zIndex = (CONFIG.bubbleLayer ?? 'front') === 'behind' ? -1 : 2;
                if (side) {
                    const { gap } = this.bubbleMetrics();
                    // 擺左側時要再往左退自己一個身（-100%）。gap 允許負數，
                    // 所以正負分開組字串，避免產生 calc(-100% - -6px) 這種雙負號
                    const back = gap >= 0 ? `- ${gap}px` : `+ ${-gap}px`;
                    this.bubble.style.left = bubbleSide === 1 ? '100%' : '0';
                    this.bubble.style.transform = bubbleSide === 1
                        ? `translateX(${gap}px)`
                        : `translateX(calc(-100% ${back}))`;
                    // 垂直錨在身高六成處，再吃 bubbleSideLift 的幾個 px 微調。
                    // 正負號分開組，避免 calc(60% + -3px) 這種雙符號
                    const lift = Math.round(CONFIG.bubbleSideLift ?? 2);
                    this.bubble.style.bottom = lift === 0
                        ? '60%'
                        : `calc(60% ${lift > 0 ? '+' : '-'} ${Math.abs(lift)}px)`;
                } else {
                    this.bubble.style.left = '50%';
                    this.bubble.style.transform = 'translateX(-50%)';
                    this.bubble.style.bottom = 'calc(100% + 2px)';
                }
                this.bubbleSide = bubbleSide; // 記住實際擺在哪側，換側時才動 DOM
            }

            // 起跳：拋物線小跳的共用入口（點擊互動與發呆亂跳都走這裡）
            jump() {
                this.jumpV = 4 * (0.7 + 0.3 * this.sizeScale); // 起跳初速，體型越大跳得越高
            }

            // 被戳（滑鼠右鍵，或遙控 poke 指令）：小跳一下 + 冒愛心，1.6 秒後自動收起。
            // 走路中、發呆中、甚至半空中都可以戳（半空中再戳會重新起跳）。
            // 色違登場閃光的保護期內只跳、不換對話框
            poke() {
                if (this.state === 'HELD') return; // 正在手上掙扎，戳不動
                this.jump();
                this.showEmote('heart', 1600);
            }

            // 被抓起來。整隻等於暫時離場：寒暄放對方自由、追到一半的果實收掉
            // （不留沒人吃的孤兒果實占著上限），對話框也收起來
            grab(pointer) {
                if (this.state === 'HELD') return;
                this.breakGreet();
                if (this.targetBerry) {
                    removeBerry(this.targetBerry);
                    this.targetBerry = null;
                }
                this.state = 'HELD';
                this.idleTimer = 0;
                this.hideEmote();
                // 掙扎從相位 0 起算：擺盪與抖動都從「不動」開始長出來，
                // 左鍵輕點一下（抓起來隨即放開）才不會閃一格歪頭
                this.walkPhase = 0;
                // 抓起來的那一刻不跳位：先把當下的離地高度接管過來，
                // 再記住「游標與身體」的相對位置，之後就照這個位移跟著走
                this.holdY = this.bobY + this.jumpY;
                this.jumpY = 0;
                this.jumpV = 0;
                this.grabDX = pointer.x - this.x;
                this.grabDY = pointer.bottom - groundLevel - this.holdY;
                this.el.className = 'pokemon-container held';
                this.img.style.transformOrigin = '50% 50%'; // 吊在手上：以身體中心為支點擺盪
                this.dragTo(pointer);
            }

            // 跟著游標走：面向被拉的方向，X 每一幀還會被 update() 的邊界檢查
            // 夾回活動範圍（游標拉出界就貼著界線繼續掙扎，不會被拖出場外），
            // 高度夾在地面與「整隻還看得見」之間
            dragTo(pointer) {
                if (this.state !== 'HELD') return;
                const nx = pointer.x - this.grabDX;
                if (Math.abs(nx - this.x) > 1) this.direction = nx > this.x ? 1 : -1;
                this.x = nx;
                const height = this.img.offsetHeight || CONFIG.baseSize * this.sizeScale;
                const ceiling = Math.max(0, window.innerHeight - groundLevel - height);
                this.holdY = Math.min(Math.max(pointer.bottom - groundLevel - this.grabDY, 0), ceiling);
            }

            // 在手上掙扎的每一幀：高頻的上下抖 + 左右擺盪。
            // GIF 本身的播放速率瀏覽器不給控制，「掙扎感」是這裡自己畫的，
            // dragStruggleRate 就是它的倍速（2 = 兩倍快，0 = 不掙扎）
            struggle(deltaTime) {
                const rate = Math.max(0, CONFIG.dragStruggleRate ?? 2);
                this.walkPhase += deltaTime * STRUGGLE_FREQ * rate;
                this.bobY = Math.abs(Math.sin(this.walkPhase)) * this.hopHeight * 0.6;
                // 擺盪取一半頻率，跟上下抖錯開，才不會整齊得像機械
                this.struggleAngle = Math.sin(this.walkPhase * 0.5) * STRUGGLE_TILT;
            }

            // 放手：把手上的高度交還給跳躍系統，用同一套重力自由落體回地面
            release() {
                if (this.state !== 'HELD') return;
                this.jumpY = this.holdY;
                this.jumpV = 0;
                this.holdY = 0;
                this.struggleAngle = 0;
                this.state = 'WALKING';
                this.el.className = 'pokemon-container';
                this.img.style.transformOrigin = ''; // 交還給 CSS 的 center bottom
            }

            // 本體中心的 X 座標（this.x 是左緣）：算「誰離果實最近」用
            centerX() {
                return this.x + (this.img.offsetWidth || CONFIG.baseSize * this.sizeScale) / 2;
            }

            // 餵食流程中（發現 → 跑去 → 吃 → 愛心）：一隻只追一顆，
            // 期間不會發現其他果實，也不能被指派新的
            isFeeding() {
                return this.state === 'SEEK_BERRY'
                    || this.state === 'EATING'
                    || this.state === 'FEED_HEART';
            }

            // 有沒有空接一顆果實：看得見（sprite 兩段備援都失敗的不算，
            // 果實被看不見的東西吃掉太獵奇）、不在餵食流程中、也不在誰的手上。
            // 被抓著的那隻等於暫時離場：果實丟給牠會沒人去吃，還占著上限，
            // 所以點空白處、遙控 feed、信使鳥空投三個入口都問這一句
            canTakeBerry() {
                return this.el.style.display !== 'none'
                    && !this.isFeeding()
                    && this.state !== 'HELD';
            }

            // 發現果實：冒出驚嘆號，不論正在走路還是發呆都放下手邊的事。
            // 驚嘆號被婉拒時（bubblePosition=none 或色違閃光保護期），
            // 至少把進行中的心情收起（hideEmote 會給保護期讓路）
            startSeekBerry(target) {
                this.breakGreet(); // 寒暄中被果實叫走：自己收場、放對方自由
                this.targetBerry = target;
                this.state = 'SEEK_BERRY';
                this.idleTimer = 0;
                if (!this.showEmote('exclaim', 900)) this.hideEmote();
            }

            // 小跑步奔向自己的那顆果實：比散步快一截、跳步節奏也跟著加快。
            // 到口邊若果實還在半空，就站在底下等它落地（半空中接不到）
            seekBerry(deltaTime) {
                const berry = this.targetBerry;
                if (!berry) { this.state = 'WALKING'; return; } // 果實意外沒了就回去散步
                const dt = deltaTime / (1000 / 60);
                const dx = berry.x - this.centerX();
                if (Math.abs(dx) > 6) {
                    this.direction = dx > 0 ? 1 : -1;
                    const step = Math.max(this.speed * 2.5, 1) * dt;
                    this.x += Math.sign(dx) * Math.min(Math.abs(dx), step);
                    this.walkPhase += deltaTime * CONFIG.hopFrequency * 2.5 * (this.speed / CONFIG.baseSpeed);
                    this.bobY = Math.abs(Math.sin(this.walkPhase)) * this.hopHeight;
                } else {
                    this.bobY *= 0.8; // 站定等吃
                    if (berry.state === 'LANDED') {
                        this.direction = dx >= 0 ? 1 : -1; // 面向果實開動
                        this.state = 'EATING';
                        this.eatTimer = 900;
                    }
                }
            }

            // 三口吃掉：果實隨剩餘時間分段縮小（縮放錨在底邊，往地面收），
            // 最後一口消失 → 開心跳 + 冒愛心，進入 FEED_HEART 收尾
            eatBerry(deltaTime) {
                this.bobY *= 0.8;
                this.eatTimer -= deltaTime;
                if (this.targetBerry) {
                    const bite = this.eatTimer > 600 ? 1 : this.eatTimer > 300 ? 0.72 : 0.45;
                    this.targetBerry.el.style.transform = `scale(${bite})`;
                }
                if (this.eatTimer <= 0) {
                    if (this.targetBerry) {
                        removeBerry(this.targetBerry);
                        this.targetBerry = null;
                    }
                    this.jump();
                    this.showEmote('heart', 1600); // 色違保護期中會被婉拒，收尾計時照走
                    this.state = 'FEED_HEART';
                    this.heartTimer = 1600;
                }
            }

            // 色違登場的慶祝特效：一圈像素星星從本體中心向外炸開、漸淡。
            // 圖片載入後才觸發（本體現身的那一刻），星星本身用完即丟
            celebrateShiny() {
                // 背景分頁沒人在看，星星白放（清理還得靠 animationend，
                // 背景的動畫時鐘不可靠）——跳過這輪，重播排程照常鏈下去，
                // 切回分頁後的下一輪就看得到
                if (!document.hidden) {
                    const height = this.img.offsetHeight || CONFIG.baseSize * this.sizeScale;
                    const colors = ['#ecb200', '#ffd84d']; // 星光金 × 亮金，同色系兩層次
                    const count = 10;
                    for (let i = 0; i < count; i++) {
                        const shape = i % 2 === 0 ? 'big' : 'small';
                        const star = document.createElement('img');
                        star.className = 'burst-star';
                        star.src = getStarURI(shape, colors[Math.floor(Math.random() * colors.length)]);
                        star.style.animationDuration = `${CONFIG.shinyBurstDuration ?? 1400}ms`;
                        const w = STAR_ARTS[shape][0].length * this.bubbleScale;
                        star.style.width = `${w}px`;
                        // 從本體中央出發：角度沿「上半弧」平均分佈再加小亂數
                        // （不取整圈：往正下方飛會立刻被頁面底邊裁掉），距離依體型放大
                        const angle = Math.PI * (-0.15 + 1.3 * (i / (count - 1))) + (Math.random() - 0.5) * 0.3;
                        // 飛散半徑 = 基礎距離 × 體型 × 全頁倍率（shinyBurstScale 只放大範圍，星星本身大小不變）
                        const dist = (26 + Math.random() * 16) * (0.7 + this.sizeScale * 0.5)
                                     * (CONFIG.shinyBurstScale ?? 1);
                        star.style.left = `calc(50% - ${Math.round(w / 2)}px)`;
                        star.style.bottom = `${Math.round(height * 0.5)}px`;
                        star.style.setProperty('--dx', `${Math.round(Math.cos(angle) * dist)}px`);
                        star.style.setProperty('--dy', `${Math.round(-Math.sin(angle) * dist)}px`);
                        star.addEventListener('animationend', () => star.remove());
                        this.el.appendChild(star);
                    }
                }

                // 每隔一段隨機秒數重播一輪：色違常駐在頁面上，
                // 開頁那一下沒看到（或中途才進來）的人也不會錯過
                this.burstTimer = setTimeout(() => this.celebrateShiny(),
                    randomInt(CONFIG.shinyBurstDelay?.min ?? 15000, CONFIG.shinyBurstDelay?.max ?? 20000));
            }

            // 只有站定發呆時才有機會冒心情對話框；走路中不觸發
            maybeShowEmote() {
                if (Math.random() >= (CONFIG.bubbleChance ?? 0.5)) return;
                const names = Object.keys(EMOTE_ICONS);
                this.showEmote(names[randomInt(0, names.length - 1)]);
            }

            // ---- 偶遇打招呼 (Greeting) ----
            // 有沒有空停下來寒暄：走路或發呆中、看得見、也不在寒暄冷卻期。
            // 餵食流程中（isFeeding）與寒暄中的都算沒空
            canGreet() {
                return (this.state === 'WALKING' || this.state === 'IDLE')
                    && this.el.style.display !== 'none'
                    && this.greetCooldown <= 0;
            }

            // 進入寒暄。不是原地開聊：擦肩相遇時兩隻多半疊在一起，
            // 先各退到「彼此身寬 + 一點空隙」的站位（SPACING），
            // 雙方都就位、面對面之後才冒對話框開聊（CHAT）
            startGreet(partner, faceDir, duration, targetX) {
                this.greetPartner = partner;
                this.state = 'GREETING';
                this.greetPhase = 'SPACING';
                this.greetTargetX = targetX;
                this.greetFace = faceDir;      // 就位後要面向對方的方向
                this.greetDuration = duration; // 聊多久（開聊那一刻才起跳）
                this.greetTimer = 4000;        // 讓位的保險絲：站位走不到就整組放棄
                this.idleTimer = 0;
                this.hideEmote(); // 對話框等面對面後才出現，先收掉進行中的心情
            }

            // 寒暄的每一幀（GREETING 狀態）
            greet(deltaTime) {
                if (this.greetPhase === 'CHAT') {
                    // 聊天中：站定緩緩落地，聊完各自轉身走開
                    this.bobY *= 0.8;
                    this.greetTimer -= deltaTime;
                    if (this.greetTimer <= 0) this.endGreet(true);
                    return;
                }
                // 讓位卡住（視窗中途縮放把站位擠到界外之類）就整組放棄，
                // 別讓兩隻站成雕像
                this.greetTimer -= deltaTime;
                if (this.greetTimer <= 0) { this.breakGreet(); return; }
                const dx = this.greetTargetX - this.x;
                if (this.greetPhase === 'SPACING' && Math.abs(dx) > 1) {
                    // 面向移動方向、用小跑步的節奏讓開
                    const dt = deltaTime / (1000 / 60);
                    this.direction = dx > 0 ? 1 : -1;
                    const step = Math.max(this.speed * 2.5, 1) * dt;
                    this.x += Math.sign(dx) * Math.min(Math.abs(dx), step);
                    this.walkPhase += deltaTime * CONFIG.hopFrequency * 2.5 * (this.speed / CONFIG.baseSpeed);
                    this.bobY = Math.abs(Math.sin(this.walkPhase)) * this.hopHeight;
                    return;
                }
                // 就位：站上目標點、轉頭面向對方，等對方也站好
                this.x = this.greetTargetX;
                this.greetPhase = 'READY';
                this.direction = this.greetFace;
                this.bobY *= 0.8;
                // 兩隻都就位 → 同一刻開聊（對話框此刻才出現）
                if (this.greetPartner?.greetPhase === 'READY') {
                    this.beginChat();
                    this.greetPartner.beginChat();
                }
            }

            // 就位面對面後開聊：冒音符或愛心（兩隻各自擲骰，不一定同款）。
            // 對話框被婉拒時（bubblePosition=none 或色違閃光保護期）就靜靜相望
            beginChat() {
                this.greetPhase = 'CHAT';
                this.greetTimer = this.greetDuration;
                this.direction = this.greetFace;
                if (!this.showEmote(Math.random() < 0.5 ? 'note' : 'heart', this.greetDuration)) {
                    this.hideEmote();
                }
            }

            // 結束寒暄回去散步。turnAway = 聊完轉身走開（被打斷時不轉，直接辦正事）；
            // 掉頭與寒暄都進冷卻——結束時兩隻還在彼此的 personalSpace 裡，
            // 沒有冷卻的話下一幀就會再互相觸發
            endGreet(turnAway = false) {
                if (this.state !== 'GREETING') return;
                this.state = 'WALKING';
                this.greetPhase = null;
                this.greetPartner = null;
                this.hideEmote();
                if (turnAway) this.direction *= -1;
                this.avoidCooldown = randomInt(1500, 3000);
                this.greetCooldown = randomInt(8000, 15000);
            }

            // 寒暄被打斷（被果實叫走、被遙控送走）：自己收場、也放對方自由，
            // 別讓對方對著空氣講完整段話
            breakGreet() {
                this.greetPartner?.endGreet();
                this.endGreet();
            }

            // 行進方向的前方太近有同伴就掉頭；掉頭後進入冷卻，
            // 避免在牆角或人群中來回抖動
            avoidCrowding(others) {
                if (this.avoidCooldown > 0) return;
                for (const other of others) {
                    if (other === this) continue;
                    if (other.state === 'HELD') continue; // 被抓在半空的不算路障
                    const dx = other.x - this.x;
                    if (Math.abs(dx) < CONFIG.personalSpace && Math.sign(dx) === this.direction) {
                        // 偶遇打招呼：雙方都有空的話，小機率不掉頭，
                        // 改停下來面對面寒暄一下再各走各的。
                        // 站位以兩隻中心的中點為基準往外讓開：
                        // 中心距 = 半身寬相加 + 空隙，身體才不會疊在一起；
                        // 目標都夾回活動範圍，貼著邊界相遇也讓得開
                        if (this.canGreet() && other.canGreet()
                            && Math.random() < (CONFIG.greetChance ?? 0)) {
                            const duration = randomInt(1600, 2600);
                            const wa = this.img.offsetWidth || CONFIG.baseSize * this.sizeScale;
                            const wb = other.img.offsetWidth || CONFIG.baseSize * other.sizeScale;
                            const mid = (this.centerX() + other.centerX()) / 2;
                            const sep = (wa + wb) / 2 + GREET_GAP; // 站定後的中心距
                            const side = Math.sign(dx); // 對方在我的哪一側
                            const clampX = (tx, w) => {
                                const minX = window.innerWidth * CONFIG.bounds.min;
                                const maxX = Math.max(minX, window.innerWidth * CONFIG.bounds.max - w);
                                return Math.min(Math.max(tx, minX), maxX);
                            };
                            this.startGreet(other, side, duration,
                                clampX(mid - side * sep / 2 - wa / 2, wa));
                            other.startGreet(this, -side, duration,
                                clampX(mid + side * sep / 2 - wb / 2, wb));
                            break;
                        }
                        this.direction *= -1;
                        this.avoidCooldown = randomInt(1500, 3000);
                        break;
                    }
                }
            }

            idle(deltaTime) {
                // 發呆時緩緩落回地面，不要硬生生定格在半空中
                this.bobY *= 0.8;
                if (this.bobY < 0.1) this.bobY = 0;

                // 發呆亂跳：站穩在地上時，機率性原地開心跳一下
                // （落地才擲骰，不會在半空中連鎖二段跳）
                if (this.jumpY === 0 && this.jumpV === 0
                    && Math.random() < (CONFIG.idleJumpChance ?? 0)) {
                    this.jump();
                }

                this.idleTimer -= deltaTime;
                if (this.idleTimer <= 0) {
                    this.state = 'WALKING';
                    this.hideEmote(); // 開始走路就收起對話框（保護期中的閃光除外）
                    // 隨機決定是否轉向
                    if (Math.random() > 0.5) {
                        this.direction *= -1;
                    }
                }
            }

            updateDOM() {
                // 位置（container）與翻面（sprite 圖片）分開處理：
                // - 位置每一幀都在變，直接設定、不套緩動，才不會有飄移感
                // - 翻面用「瞬間鏡像」，補間 scaleX 會經過 0 導致被壓扁成一條線
                //   （2D 像素遊戲的角色轉向本來就是瞬間翻面，這樣反而最自然）
                this.el.style.transform = `translate3d(${this.x}px, 0, 0)`;

                // 對話框顯示中要換邊時（轉向、或走到畫面邊緣得翻到內側），
                // 跟著換邊並鏡像尾巴。判斷純算術，同一側就不動 DOM
                if (this.bubbleName && this.bubble.style.display !== 'none') {
                    const bubbleSide = this.desiredBubbleSide();
                    if (bubbleSide !== this.bubbleSide) this.placeBubble(bubbleSide);
                }

                // 原圖面向左邊：direction 1 (向右) -> scaleX(-1) 鏡像
                const scale = this.direction === 1 ? -1 : 1;
                // 走路跳步 + 點擊跳躍 + 被抓在手上的高度，三者疊加後的離地高度
                const lift = this.bobY + this.jumpY + this.holdY;
                // 掙扎的傾角接在最後（沒在掙扎時不寫，字串維持原樣）
                const tilt = this.struggleAngle ? ` rotate(${this.struggleAngle.toFixed(1)}deg)` : '';
                this.img.style.transform = `scaleX(${scale}) translateY(${-lift}px)${tilt}`;

                // 跳起來時影子縮小、變淡，強化離地的感覺
                // （走路跳步以自身跳高為滿格；離地高度以 20px 為滿格，取較高者）
                const airRatio = Math.min(
                    Math.max(this.bobY / this.hopHeight, (this.jumpY + this.holdY) / 20), 1);
                this.shadow.style.transform = `translateX(-50%) scale(${1 - airRatio * 0.3})`;
                this.shadow.style.opacity = 1 - airRatio * 0.4;

                // 調整 Z-index 根據 X 軸位置（避免負值造成排序問題）。
                // 被抓在手上的那隻疊到最前面（客串 10000 之上、果實 20000 之下）——
                // 手上的東西被別人擋住很出戲
                this.el.style.zIndex = this.state === 'HELD'
                    ? 15000
                    : Math.max(0, Math.floor(this.x));
            }
        }

        // ---------------------------------------------------------
        // 客串事件 (Fly-by Cameo)
        // 三層機率：
        //   1. 隨機間隔——從 flybyDelay 區間抽下一個「擲骰時點」
        //   2. flybyChance——該時點是否真的觸發
        //   3. 抽誰——飛行池平均分佈，flybyLegendaryChance 的極低機率改抽傳說池
        // 客串不加入常駐陣容：從畫面外高速橫越，飛出另一側就移除。
        // 色違吃全頁同一個 shinyChance，中了會拖著金色星塵尾跡（流星本人）
        // ---------------------------------------------------------
        class Cameo {
            constructor(id, sizeScale, opts = {}) {
                this.dead = false;
                this.delivery = !!opts.delivery; // 空投任務：叼著果實，半路鬆爪
                this.carried = null; // 叼著的那顆果實元素
                this.dropX = null;   // 預定投放點（試過一次就清掉，不回頭）
                this.direction = Math.random() > 0.5 ? 1 : -1;
                // 每次 ±15% 隨機，連續兩次客串速度也不會一模一樣
                this.speed = (CONFIG.flybySpeed ?? 5) * (0.85 + Math.random() * 0.3);
                this.isShiny = Math.random() < (CONFIG.shinyChance ?? 0);
                const shinyDir = this.isShiny ? 'shiny/' : '';

                this.height = Math.round(CONFIG.baseSize * sizeScale);
                this.el = document.createElement('div');
                this.el.className = 'cameo';
                // 高度以 bottom: 0 為基準，實際垂直位置全走 transform
                // （斜線 + 浮沉每一幀都在變，translate 不觸發 layout）
                this.el.style.bottom = '0px';

                this.img = document.createElement('img');
                this.img.className = 'sprite';
                this.img.style.height = `${this.height}px`;
                // 原圖面向左：往右飛要鏡像
                this.img.style.transform = this.direction === 1 ? 'scaleX(-1)' : '';
                this.img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/${shinyDir}${id}.gif`;
                // 備援同散步成員：動圖 → 靜圖 → 直接取消這次客串
                this.img.onerror = () => {
                    this.img.onerror = () => {
                        this.img.onerror = null;
                        this.dead = true;
                    };
                    this.img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${shinyDir}${id}.png`;
                };
                this.el.appendChild(this.img);

                // 出發點：畫面外一個身位（寬度未載入前用高度概算，流星不等人）
                this.margin = this.height * 1.5 + 40;
                this.startX = this.direction === 1 ? -this.margin : window.innerWidth + this.margin;
                this.x = this.startX;
                this.trailTimer = 0;

                // 斜線航道：起點與終點高度「各自」在視窗高 45% ~ 75% 內隨機——
                // 這趟可能從左 45% 爬升到右 60%，下一趟從右 70% 滑降到左 50%。
                // （45%~75%：OBS 全畫布時劃過半空，200px 的 footer iframe 也還在框內、
                //   於散步成員的頭頂之上）
                const altitude = () => window.innerHeight * (0.45 + Math.random() * 0.3);
                this.startBottom = altitude();
                this.endBottom = altitude();
                // 每前進 1px 的爬升/下降量，以出發當下的全程距離換算
                this.slope = (this.endBottom - this.startBottom) / (window.innerWidth + this.margin * 2);

                // 浮沉：飛行版的小跳步。走路是 |sin| 的落地彈跳，
                // 飛行是完整 sin 波的上下漂浮；振幅與節奏每隻略異，不會像編隊飛行
                this.floatPhase = Math.random() * Math.PI * 2;
                this.floatAmp = 3 + Math.random() * 4;          // 3 ~ 7 px
                this.floatFreq = 0.003 + Math.random() * 0.003; // 相位速度 rad/ms

                // 空投任務：果實掛在腳下跟著飛，投放點在活動範圍內隨機挑
                // （散步成員才搆得到落點，不會丟到牆外沒人撿）
                if (this.delivery) {
                    this.carried = document.createElement('img');
                    this.carried.className = 'berry';
                    this.carried.src = getBerryURI();
                    this.carried.style.width = `${BERRY_ART[0].length * BERRY_SCALE}px`;
                    this.carried.style.left = '50%';
                    this.carried.style.transform = 'translateX(-50%)';
                    this.carried.style.bottom = '-24px'; // 叼在腳下，稍微咬進腳邊
                    this.el.appendChild(this.carried);
                    this.dropX = window.innerWidth
                        * (CONFIG.bounds.min + Math.random() * (CONFIG.bounds.max - CONFIG.bounds.min));
                }

                app.appendChild(this.el);
                this.render();
            }

            // 回傳是否還在畫面行程內（false = 該移除了）
            update(deltaTime) {
                if (this.dead) return false;
                const dt = deltaTime / (1000 / 60);
                this.x += this.speed * this.direction * dt;
                this.floatPhase += deltaTime * this.floatFreq;

                // 色違的星塵尾跡：定時在「身後」撒一顆金星，飄落漸淡
                if (this.isShiny) {
                    this.trailTimer -= deltaTime;
                    if (this.trailTimer <= 0) {
                        this.dropTrailStar();
                        this.trailTimer = 90;
                    }
                }

                this.render();

                // 空投：飛越預定投放點時鬆爪，果實從飛行高度掉下去、
                // 走一般的餵食流程。這一刻沒隻有空（throwBerry 婉拒）就整顆
                // 叼走——果實不落在沒人吃的地上；只試這一次，飛過了不回頭
                if (this.carried && this.dropX !== null
                    && (this.direction === 1 ? this.x >= this.dropX : this.x <= this.dropX)) {
                    const w = this.el.offsetWidth || this.height;
                    if (throwBerry(this.x + w / 2, Math.max(0, this.curBottom - 24))) {
                        this.carried.remove();
                        this.carried = null;
                    }
                    this.dropX = null;
                }

                return this.direction === 1
                    ? this.x <= window.innerWidth + this.margin
                    : this.x >= -this.margin;
            }

            render() {
                // 垂直位置 = 航道起點高度 + 斜率 × 已飛距離 + 浮沉波
                const traveled = Math.abs(this.x - this.startX);
                this.curBottom = this.startBottom + traveled * this.slope
                                 + Math.sin(this.floatPhase) * this.floatAmp;
                this.el.style.transform = `translate3d(${this.x}px, ${-Math.round(this.curBottom)}px, 0)`;
            }

            dropTrailStar() {
                const shape = Math.random() < 0.5 ? 'big' : 'small';
                const star = document.createElement('img');
                star.className = 'burst-star';
                star.src = getStarURI(shape, Math.random() < 0.5 ? '#ecb200' : '#ffd84d');
                star.style.width = `${STAR_ARTS[shape][0].length * 2}px`;
                star.style.animationDuration = '700ms';
                // 撒在目前身體中央（跟著斜線航道的當下高度），靠 CSS 動畫往後下方飄散
                star.style.left = `${Math.round(this.x + this.height * 0.6)}px`;
                star.style.bottom = `${Math.round(this.curBottom + this.height * 0.45)}px`;
                star.style.zIndex = 9999; // 墊在本體後面一階
                star.style.setProperty('--dx', `${-this.direction * (14 + Math.round(Math.random() * 18))}px`);
                star.style.setProperty('--dy', `${10 + Math.round(Math.random() * 16)}px`);
                star.addEventListener('animationend', () => star.remove());
                app.appendChild(star);
            }
        }

        // 排程器：抽下一個擲骰時點 → 到點擲骰 → 不論中沒中，再排下一輪。
        // 分頁在背景時這次擲骰直接作廢：setTimeout 在背景照跑，但 rAF 是停的，
        // 生出來的客串只會凍在半空累積，切回分頁的瞬間全員同時起飛（流星雨）。
        // OBS 的瀏覽器來源永遠算可見，不受影響
        function scheduleFlyby() {
            const delay = randomInt(CONFIG.flybyDelay.min, CONFIG.flybyDelay.max);
            setTimeout(() => {
                if (!document.hidden && Math.random() < (CONFIG.flybyChance ?? 0)) spawnFlyby();
                scheduleFlyby();
            }, delay);
        }

        // 信使鳥：叼果實空投的專職快遞員（聖誕鳥送禮的原作梗）
        const DELIVERY_ID = 225;

        async function spawnFlyby() {
            // 信使鳥空投：小機率這趟客串改派信使鳥叼著果實橫越，半路鬆爪空投，
            // 落地後就是一般的餵食流程（果實總開關關著就不派這趟任務）
            if ((CONFIG.berry ?? 'on') !== 'off'
                && Math.random() < (CONFIG.flybyDeliveryChance ?? 0)) {
                cameos.push(new Cameo(DELIVERY_ID, await getSizeScale(DELIVERY_ID), { delivery: true }));
                return;
            }
            const legendary = Math.random() < (CONFIG.flybyLegendaryChance ?? 0);
            const pool = legendary ? window.POKE_LEGENDARY : window.POKE_FLYING;
            if (!pool || !pool.length) return;
            const id = pool[randomInt(0, pool.length - 1)];
            // 體型分級與散步成員同一套，世界觀比例一致（傳說通常就是大隻）
            cameos.push(new Cameo(id, await getSizeScale(id)));
        }

        // ---------------------------------------------------------
        // 丟果實餵食 (Berry Feeding)
        // 左鍵點「寶可夢本體」= 抓起來（事件在本體上就被攔下）；
        // 左鍵點「空白處」= 從點擊位置掉下一顆樹果，距離最近且「有空」的
        // 那隻冒出驚嘆號發現它，跑過來三口吃掉 + 冒愛心。
        // 一隻只追一顆：整套（發現 → 跑去 → 吃 → 愛心）演完前
        // 不會發現其他果實。丟新果實要有隻有空的，這個配對制
        // 同時就是上限——場上同時最多「常駐數量」顆果實
        // ---------------------------------------------------------
        let berries = [];    // 場上的果實們 [{ el, x, bottom, vy, state, feeder }]
        let groundLevel = 0; // 果實落點 = 地面抬高量（主題地面），init() 時寫入

        function feedingBusy() {
            return berries.length > 0;
        }

        // 果實吃完（或意外沒了）的下場：DOM 移除 + 從場上除名
        function removeBerry(b) {
            b.el.remove();
            const i = berries.indexOf(b);
            if (i >= 0) berries.splice(i, 1);
        }

        function throwBerry(x, dropBottom) {
            if ((CONFIG.berry ?? 'on') === 'off') return false;
            // 有空的定義見 canTakeBerry()：一隻只追一顆，忙完才會發現下一顆
            const free = pokemons.filter(p => p.canTakeBerry());
            if (!free.length) return false; // 大家都在忙 → 這顆丟不出去

            // 有空的裡面距離最近的那隻發現果實，跑過來吃
            const feeder = free.reduce((a, b) =>
                Math.abs(a.centerX() - x) <= Math.abs(b.centerX() - x) ? a : b);

            // 果實釘在被指派那隻「碰得到」的範圍內：
            // 活動範圍（bounds）外的點擊，果實會落在最近的可達位置，
            // 否則牠會在邊界前踏步、永遠搆不到，整套餵食就此卡死
            const half = (feeder.img.offsetWidth || CONFIG.baseSize * feeder.sizeScale) / 2;
            const minC = window.innerWidth * CONFIG.bounds.min + half;
            const maxC = Math.max(minC, window.innerWidth * CONFIG.bounds.max - half);
            const bx = Math.min(Math.max(x, minC), maxC);

            const w = BERRY_ART[0].length * BERRY_SCALE;
            const el = document.createElement('img');
            el.className = 'berry';
            el.src = getBerryURI();
            el.style.width = `${w}px`;
            el.style.left = `${Math.round(bx - w / 2)}px`;
            const startBottom = Math.max(groundLevel, dropBottom);
            el.style.bottom = `${Math.round(startBottom)}px`;
            app.appendChild(el);
            const berry = {
                el, x: bx, bottom: startBottom, vy: 0,
                state: startBottom > groundLevel ? 'FALLING' : 'LANDED',
                feeder,
            };
            berries.push(berry);

            feeder.startSeekBerry(berry);
            return true;
        }

        // 果實們的掉落物理（每一幀由 gameLoop 呼叫）：
        // 重力手感與點擊跳躍同一套，落地夠快會小彈跳一次
        function updateBerries(deltaTime) {
            const dt = deltaTime / (1000 / 60);
            for (const berry of berries) {
                if (berry.state !== 'FALLING') continue;
                berry.vy += 0.35 * dt;
                berry.bottom -= berry.vy * dt;
                if (berry.bottom <= groundLevel) {
                    berry.bottom = groundLevel;
                    if (berry.vy > 2.5) {
                        berry.vy = -berry.vy * 0.35; // 彈起（速度衰減）
                    } else {
                        berry.state = 'LANDED';
                    }
                }
                berry.el.style.bottom = `${Math.round(berry.bottom)}px`;
            }
        }

        // 點擊分流：本體的 click 監聽器會 stopPropagation，
        // 事件能冒泡到 document 的都是「空白處」。
        // 座標換算成 bottom 基準（頁面底 = 0），跟其他元素同一套座標系
        document.addEventListener('click', e => {
            // 拖曳的結尾也會補一發 click（放手處若不在本體上，就直接冒到這裡）。
            // 那不是「點空白處」，別掉果實
            if (swallowClick) { swallowClick = false; return; }
            throwBerry(e.clientX, window.innerHeight - e.clientY);
        });

        // ---------------------------------------------------------
        // 滑鼠拖曳 (Drag)
        // 三種按法各司其職，彼此不搶：
        //   左鍵按本體  = 抓起來拖著走（按下的那一幀就跟手）
        //   右鍵點本體  = 戳戳互動（跳一下 + 冒愛心）
        //   左鍵點空白  = 丟一顆果實
        // 抓取「沒有長按門檻」是刻意的：門檻期間身體不動、游標卻繼續走，
        // 那段距離會被凍進偏移量裡，之後整段拖曳都差一截（0.30.0 的教訓）。
        // 按下即抓，偏移量就是你按在身上的那一點，怎麼甩都跟手。
        // 抓在手上的那隻等於暫時離場：不散步、不冒心情對話框、不寒暄、
        // 戳不動，也不會被指派果實（canTakeBerry 一條規則管住三個入口）。
        // 游標拉出活動範圍時牠貼著邊界繼續掙扎，不會被拖出場外；
        // 放開手就從當下高度自由落體回地面
        // ---------------------------------------------------------
        let dragTarget = null;    // 正被抓著的那一隻
        let dragPointer = { x: 0, bottom: 0 }; // 游標位置（bottom 基準，與其他元素同座標系）
        let swallowClick = false; // 拖曳結束後緊接著那一發 click 要吞掉

        function trackPointer(e) {
            dragPointer = { x: e.clientX, bottom: window.innerHeight - e.clientY };
        }

        // 左鍵按在本體上：立刻抓起來
        function beginDrag(p, e) {
            if ((CONFIG.drag ?? 'on') !== 'on') return;
            if ((e.button ?? 0) !== 0) return;         // 只認左鍵，右鍵留給戳戳互動
            if (dragTarget) return;                    // 一次只抓一隻（多指觸控時後來的那根不理）
            if (p.el.style.display === 'none') return; // 隱形的（載圖全滅）抓不到
            trackPointer(e);
            // 指標捕獲：游標滑出視窗外也還收得到後續事件，手不會莫名其妙鬆開
            p.el.setPointerCapture?.(e.pointerId);
            dragTarget = p;
            p.grab(dragPointer);
        }

        // 放開手（或事件被系統取消、視窗失焦）：抓著的那隻落地
        function endDrag() {
            if (!dragTarget) return;
            dragTarget.release();
            dragTarget = null;
            swallowClick = true; // 放手那一下別又被解讀成丟果實
        }

        // 正被抓著的那隻被遙控 leave 送走時得先鬆手，
        // 否則游標會繼續拖著一個已經從場上除名的元素
        function releaseDrag(p) {
            if (dragTarget === p) {
                dragTarget.release();
                dragTarget = null;
            }
        }

        // 監聽掛在 document 上而不是每隻身上：游標移動速度快過重繪時會滑出本體，
        // 掛在本體上就會中途斷線
        document.addEventListener('pointermove', e => {
            trackPointer(e);
            dragTarget?.dragTo(dragPointer);
        });
        document.addEventListener('pointerup', endDrag);
        document.addEventListener('pointercancel', endDrag);
        // 視窗失焦（Alt-Tab、切到 OBS 別的來源）：收不到 pointerup 的最後一道保險
        window.addEventListener('blur', endDrag);
        // 按下的那一刻先把「吞掉下一發 click」的旗子清乾淨：
        // 上一輪若在視窗外放手、根本沒補那發 click，旗子不清會誤傷下一次點擊
        document.addEventListener('pointerdown', () => { swallowClick = false; });

        // ---------------------------------------------------------
        // postMessage 遙控 (Remote Control)
        // ---------------------------------------------------------
        // 父頁面（或 OBS 的 wrapper 頁）隔著 iframe 疆界下指令：
        //   frame.contentWindow.postMessage({ ns: 'poke-stroll', cmd: 'poke' }, '*')
        // 防線是「指令白名單 + 參數夾範圍 + 節流」而非 origin 驗證：
        // 指令全是無害的視覺效果，最壞情況是有人在他自己的頁面上讓皮卡丘跳舞。
        // 每道指令都回執（{ ns, re, ok, ... }），串接文件見 PARAMS.md / params.html
        const REMOTE_NS = 'poke-stroll';
        const remoteStamps = []; // 最近一秒內已處理的指令時戳（節流滑動窗）

        const REMOTE_COMMANDS = {
            // 客串一隻：帶 id 指定誰路過（不限飛行系，遙控的卡比獸也能飛），
            // 不帶 id 就照常抽池（含傳說機率那一層）
            spawn(msg) {
                // rAF 停著時生成只會凍在半空，跟排程器同一套背景分頁防護
                if (document.hidden) return { ok: false, reason: 'page hidden' };
                // delivery: true → 這趟改派信使鳥叼果實空投（果實關著就送不成）
                if (msg.delivery) {
                    if ((CONFIG.berry ?? 'on') === 'off') return { ok: false, reason: 'berry is off' };
                    getSizeScale(DELIVERY_ID).then(scale =>
                        cameos.push(new Cameo(DELIVERY_ID, scale, { delivery: true })));
                    return { ok: true, id: DELIVERY_ID };
                }
                if (msg.id !== undefined) {
                    const id = Math.round(Number(msg.id));
                    if (!Number.isFinite(id) || id < 1 || id > 1025) {
                        return { ok: false, reason: 'id must be 1~1025' };
                    }
                    getSizeScale(id).then(scale => cameos.push(new Cameo(id, scale)));
                    return { ok: true };
                }
                if (!window.POKE_FLYING?.length && !window.POKE_LEGENDARY?.length) {
                    return { ok: false, reason: 'cameo pools not loaded' };
                }
                spawnFlyby();
                return { ok: true };
            },
            // 開心跳一下 + 冒愛心：帶 id 只戳該圖鑑編號的成員，不帶就全員
            poke(msg) {
                const targets = (msg.id !== undefined
                    ? pokemons.filter(p => p.id === Math.round(Number(msg.id)))
                    : pokemons
                ).filter(p => p.state !== 'HELD'); // 抓在手上的戳不動，回執也不算牠
                targets.forEach(p => p.poke());
                return { ok: true, count: targets.length };
            },
            // 色違星星立刻重播。先清掉原本的重播計時器再放，
            // 排程鏈維持單一條，不會越 burst 越密
            burst() {
                const shinies = pokemons.filter(p => p.isShiny);
                shinies.forEach(p => { clearTimeout(p.burstTimer); p.celebrateShiny(); });
                return { ok: true, count: shinies.length };
            },
            // 加入一隻「常駐」成員（會留下來散步，不是路過的客串）：
            // 帶 id 指定誰入隊，不帶就照 minId/maxId 隨機抽。
            // 上限跟 count 參數同一個天花板，指令灌不爆隊伍
            join(msg) {
                if (pokemons.length >= (QUERY_PARAMS.count?.max ?? 50)) {
                    return { ok: false, reason: 'party is full' };
                }
                let id;
                if (msg.id !== undefined) {
                    id = Math.round(Number(msg.id));
                    if (!Number.isFinite(id) || id < 1 || id > 1025) {
                        return { ok: false, reason: 'id must be 1~1025' };
                    }
                } else {
                    id = randomInt(CONFIG.minId, CONFIG.maxId);
                }
                // 出生跑道隨機挑一條，跟開頁時的排隊邏輯同一套座標系
                getSizeScale(id).then(scale => pokemons.push(new Pokemon(
                    id, app, scale, randomInt(0, Math.max(0, CONFIG.count - 1)), groundLevel)));
                return { ok: true, id };
            },
            // 送走一隻常駐成員：帶 id 指定送誰（同編號多隻就送最晚入隊的），
            // 不帶就隨機挑。最後一隻不送——空蕩蕩的頁尾看起來像壞掉
            leave(msg) {
                if (pokemons.length <= 1) {
                    return { ok: false, reason: 'last one standing' };
                }
                let idx;
                if (msg.id !== undefined) {
                    idx = pokemons.map(p => p.id).lastIndexOf(Math.round(Number(msg.id)));
                    if (idx < 0) return { ok: false, reason: 'id not found' };
                } else {
                    idx = randomInt(0, pokemons.length - 1);
                }
                const [victim] = pokemons.splice(idx, 1);
                clearTimeout(victim.burstTimer); // 色違的星星重播鏈一併收掉
                if (victim.targetBerry) removeBerry(victim.targetBerry); // 別留孤兒果實
                victim.breakGreet(); // 寒暄到一半被送走：放對方自由
                releaseDrag(victim);  // 正被抓在手上就先鬆手，游標別拖著除名的元素
                victim.el.remove();
                return { ok: true, id: victim.id };
            },
            // 天降果實：隨機位置掉 count 顆（不帶就隨機顆數）。
            // 「一隻只追一顆」的配對制天然就是上限——最多掉「有空的成員數」顆
            feed(msg) {
                if ((CONFIG.berry ?? 'on') === 'off') return { ok: false, reason: 'berry is off' };
                // 掉落與吃相全靠 rAF 演，背景分頁只會凍在半空，跟 spawn 同一套防護
                if (document.hidden) return { ok: false, reason: 'page hidden' };
                // 參數先驗完再看場面：count 不合法就直說，別報成「在忙」
                let asked = null;
                if (msg.count !== undefined) {
                    asked = Math.round(Number(msg.count));
                    if (!Number.isFinite(asked) || asked < 1) {
                        return { ok: false, reason: 'count must be >= 1' };
                    }
                }
                const free = pokemons.filter(p => p.canTakeBerry()).length;
                if (!free) return { ok: false, reason: 'everyone is busy' };
                const want = asked === null ? randomInt(1, free) : Math.min(asked, free);
                let dropped = 0;
                for (let i = 0; i < want; i++) {
                    // 高度取畫面上半段，掉落過程才看得見；
                    // X 全寬亂撒，搆不到的位置 throwBerry 會自己釘回可達範圍
                    const h = window.innerHeight;
                    if (throwBerry(randomInt(0, Math.max(0, window.innerWidth - 1)),
                                   randomInt(Math.round(h * 0.5), Math.round(h * 0.9)))) dropped++;
                }
                return { ok: true, count: dropped };
            },
            // 盤點常駐陣容（查詢用，不動畫面）：每隻的圖鑑編號、是否色違、
            // 體型倍率（0.6 小 / 0.8 中 / 1 大）。外部程式要做陣容面板、
            // 投票名單之類的整合，資料從這裡拿
            roster() {
                return {
                    ok: true,
                    count: pokemons.length,
                    roster: pokemons.map(p => ({ id: p.id, shiny: p.isShiny, size: p.sizeScale })),
                };
            },
        };

        function handleRemoteMessage(e) {
            const msg = e.data;
            if (!msg || typeof msg !== 'object' || msg.ns !== REMOTE_NS) return; // 不是寄給我們的信，別拆
            if ((CONFIG.remote ?? 'on') === 'off') return; // 總開關關閉：連回執都不給，像沒這功能
            const reply = payload => {
                // 回執讓串接方能除錯與確認送達；對方視窗可能已經關了，失敗就算了
                try { e.source && e.source.postMessage({ ns: REMOTE_NS, re: msg.cmd ?? null, ...payload }, '*'); }
                catch (err) { /* 靜默 */ }
            };
            const fn = REMOTE_COMMANDS[msg.cmd];
            if (!fn) {
                console.warn(`[PokéFooter] 未知的遙控指令：${msg.cmd}`);
                return reply({ ok: false, reason: 'unknown cmd' });
            }
            // 節流：滑動窗超額就整道丟棄（高頻洗版時保住渲染效能）
            const t = Date.now();
            while (remoteStamps.length && t - remoteStamps[0] >= 1000) remoteStamps.shift();
            if (remoteStamps.length >= (CONFIG.remoteRateLimit ?? 10)) {
                return reply({ ok: false, reason: 'rate limited' });
            }
            remoteStamps.push(t);
            reply(fn(msg));
        }
        window.addEventListener('message', handleRemoteMessage);

        // ---------------------------------------------------------
        // 主程式邏輯 (Main)
        // ---------------------------------------------------------
        const app = document.getElementById('app');
        const pokemons = [];
        const cameos = [];
        let lastTime = 0;

        async function init() {
            // 主題地面先鋪（theme=none 不鋪）：寶可夢得知道自己該站多高
            const groundLift = initGround(CONFIG.theme ?? 'none');
            groundLevel = groundLift; // 丟下來的果實也落在同一個地面上

            // URL 有帶 ?ids= 就用固定清單，否則照 count/minId/maxId 隨機抽
            const ids = CONFIG.fixedIds ?? getUniqueRandomIds(CONFIG.count, CONFIG.minId, CONFIG.maxId);

            // 先向 PokéAPI 查每隻的身高，決定體型分級（並行查詢）
            const scales = await Promise.all(ids.map(getSizeScale));

            // 實例化 Pokemon（index 同時當作出生跑道編號）
            ids.forEach((id, i) => {
                pokemons.push(new Pokemon(id, app, scales[i], i, groundLift));
            });

            // 客串事件排程：機率 0 或名單檔沒載到（獨立檔案，可能被拿掉）就整個不啟動
            if ((CONFIG.flybyChance ?? 0) > 0 && (window.POKE_FLYING?.length || window.POKE_LEGENDARY?.length)) {
                scheduleFlyby();
            }

            // 啟動動畫迴圈
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            // 限制 deltaTime 上限：避免切換分頁再回來時瞬間跳一大步
            const deltaTime = Math.min(timestamp - lastTime, 100);
            lastTime = timestamp;

            pokemons.forEach(p => p.update(deltaTime, pokemons));

            updateBerries(deltaTime); // 丟下來的果實們（有的話）繼續掉

            // 客串成員：倒著掃，飛完行程（或載圖全滅）就移除
            for (let i = cameos.length - 1; i >= 0; i--) {
                if (!cameos[i].update(deltaTime)) {
                    cameos[i].el.remove();
                    cameos.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // 視窗大小改變不需要另外監聽：
        // update() 的邊界檢查每一幀都會用當下的視窗寬度重新計算

        // 啟動！（找不到設定檔就不啟動，並在主控台提示）
        if (CONFIG) {
            applyQueryOverrides(CONFIG);
            init();
        } else {
            console.error('[PokéFooter] 找不到 window.POKE_CONFIG，請確認 config.js 與本 HTML 放在同一個資料夾。');
        }

    </script>
</body>
</html>
