<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéFooter Widget</title>
    <style>
        /* 設定背景為透明，這是為了讓您可以嵌入到其他網頁中
        */
        :root {
            /* 釘死 light：iframe 要維持「透明」，內外文件的 color-scheme 必須一致。
               千萬別改成 light dark——那會讓 widget 在「OS 深色模式 + 嵌入方沒宣告
               color-scheme」這個最常見的組合下自己解析成 dark，跟嵌入方（light）
               不一致，瀏覽器直接墊一塊不透明黑底（比白底更糟，踩過一次）。
               釘死 light 對上所有未宣告的嵌入方；真的宣告了 dark 的頁面（例如本專案
               的 params.html），請在「iframe 元素」上加 color-scheme: light 對齊 */
            color-scheme: light;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止出現卷軸 */
            background-color: transparent;
        }

        #app {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px; /* 寶可夢活動區域的高度 */
            pointer-events: none; /* 讓滑鼠點擊穿透，不會擋住背後的內容 */
        }

        .pokemon-container {
            position: absolute;
            bottom: 0;
            /* 讓圖片呈現像素風格，比較復古可愛 */
            image-rendering: pixelated; 
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            /* 注意：這裡「不能」對 transform 掛 transition！
               位置每一幀都在更新，若套上緩動會永遠追不上目標，
               看起來就像在冰上飄移；轉向的鏡像也會經過 scaleX(0) 被壓扁成一條線 */
            cursor: grab; /* 左鍵按下去就抓得起來，游標先把這件事講清楚 */
            pointer-events: auto; /* 讓寶可夢本身可以被互動（如果有的話） */
            will-change: transform;
            /* 長按拖曳用：觸控裝置上別把「按住不放再滑」解讀成捲動手勢，
               也別讓長按選字的反白框跑出來 */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; /* iOS 長按跳出的「儲存圖片」選單會蓋掉拖曳 */
        }

        /* 被抓在手上的那一隻：游標換成「抓握中」 */
        .pokemon-container.held {
            cursor: grabbing;
        }

        /* 簡單的陰影，增加立體感。
           bottom: 0 讓橢圓最低點貼齊頁面底邊（站立狀態）；
           跳躍時影子用 scale 縮小、會離開底邊，那是預期效果 */
        .shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: -1;
        }

        /* 發呆時的心情對話框。這裡只放頭頂正上方的預設值，
           實際擺位由 JS 的 placeBubble() 依 bubblePosition 覆寫
           （top 頭頂 / side 面向側邊，side 還會跟著面向左右換邊 + 鏡像尾巴），
           上下層由 bubbleLayer 決定（z-index 也在 placeBubble() 設）。
           圖是 canvas 畫的小尺寸點陣圖，靠 pixelated 整數倍放大維持鋸齒感 */
        .bubble {
            position: absolute;
            bottom: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
        }

        /* 名牌（nametag 參數）：頭頂上的「No.25 皮卡丘」，元素由 js/nametag.js 產生。
           深色藥丸底 + 淺色字是刻意的：背景透明是這個 widget 的前提，名字會疊在
           誰家的網頁上（白底、深底、OBS 場景都可能），只有自帶底色才穩讀得到。
           不跟著本體鏡像——翻面的是容器裡的 <img>，名牌掛在容器上，所以字永遠是正的 */
        .nametag {
            position: absolute;
            bottom: calc(100% + 2px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 3; /* 對話框（2）之上：名字被心情蓋掉就沒意義了 */
            padding: 1px 5px;
            border-radius: 3px;
            background: rgba(16, 24, 40, 0.78);
            color: #eef2fa;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
            font-size: 11px; /* 由 JS 依 nametagSize 覆寫 */
            line-height: 1.45;
            white-space: nowrap;
            /* 名牌不擋滑鼠：抓、戳、丟果實都要能穿過去，
               它自己也就不會攔截 hover（不然會跟本體互搶、閃個不停） */
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .nametag .dex {
            opacity: 0.55; /* 編號退到後面，視線先落在名字上 */
            margin-right: 3px;
            font-size: 0.85em;
        }
        .nametag.shiny { color: #ffd84d; } /* 色違：跟星星特效同一組金 */
        /* hover 模式：平常收著，滑鼠移到那一隻身上才浮出來。
           OBS 與 pointer-events: none 的 iframe 本來就沒有滑鼠碰得到，
           等於預設不出現，畫面維持乾淨 */
        .nametag.on-hover { display: none; }
        .pokemon-container:hover > .nametag.on-hover { display: block; }

        /* 客串事件：從畫面外高速橫越的飛行系/傳說寶可夢。
           不可點擊（飛太快，也不是常駐成員）、蓋在所有散步成員上方 */
        .cameo {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 10000;
            will-change: transform;
        }

        /* 主題地面（theme 參數）：鋪在頁面最底、所有寶可夢身後的像素地面。
           貼片是載入時用 canvas 隨機生成的，橫向平鋪；
           水域與熔岩掛 ground-flow 讓圖樣緩慢橫向流動 */
        #ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background-repeat: repeat-x;
            pointer-events: none;
        }
        .ground-flow {
            animation: ground-flow var(--flow-duration, 20s) linear infinite;
        }
        @keyframes ground-flow {
            to { background-position-x: var(--flow-width, -512px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .ground-flow { animation: none; }
            /* 動不了的雨雪就只是一牆斑點，整組收起來（落下物同理） */
            #weather, #season { display: none; }
        }

        /* 水面倒影（theme=water）：水面下多一個上下顛倒的自己。分三層各司其職——
           .reflection 裁切（上緣＝水面、下緣＝頁面底邊，水面以下沒有更多空間了）
                       並用等距橫線的遮罩切出像素風的水紋；
           .reflect-wave 只負責左右搖曳——本體的 transform 由 JS 每幀改寫，
                       CSS 動畫掛同一個元素會互相蓋掉，所以水紋自己住一層；
           .reflect-sprite 才是鏡射的本體（transform 由 JS 給）。
           幾何與 opacity 由 js/reflect.js 逐隻算好寫進 style */
        .reflection {
            position: absolute;
            left: 0;
            width: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: -2; /* 影子（-1）之下、地面（0）之上：倒影在水裡，影子在水面 */
            -webkit-mask-image: repeating-linear-gradient(to bottom, #000 0 2px, transparent 2px 4px);
            mask-image: repeating-linear-gradient(to bottom, #000 0 2px, transparent 2px 4px);
        }
        .reflect-wave {
            animation: reflect-wave 2.4s ease-in-out infinite alternate; /* 時長由 JS 依 reflectWave 覆寫 */
        }
        @keyframes reflect-wave {
            from { transform: translateX(-1.5px); }
            to   { transform: translateX(1.5px); }
        }
        .reflect-sprite {
            position: absolute;
            left: 0;
            width: auto;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            /* 翻轉以自身正中心為軸：元素框不動，只把內容上下顛倒，
               js/reflect.js 的 top 才算得準 */
            transform-origin: center center;
        }
        @media (prefers-reduced-motion: reduce) {
            .reflect-wave { animation: none; }
        }

        /* 果實的影子：釘在地面（不跟著果實動），大小與深淺由 JS 依果實
           高度逐幀調整——越高越小越淡，快落地放大加深回來，跟寶可夢
           跳躍的影子同一套物理語彙 */
        .berry-shadow {
            position: absolute;
            width: 24px;
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 19999; /* 墊在果實（20000）的正下一層 */
        }

        /* 天氣粒子（weatherChance）：種類由主題地面決定——雨/雪/風沙/火星。
           全部用 CSS 動畫無限循環：生成一次就不再吃每一幀的 JS，
           OBS 長時間掛著也不增加主迴圈負擔。負的 animation-delay
           把相位打散，開頁那一刻就是「下到一半」的樣子，不會齊步走 */
        #weather {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1; /* 地面（0）之上、散步成員（z = X 座標）之下：天氣是背景 */
        }
        #weather > * {
            position: absolute;
            will-change: transform;
        }
        /* 雨：斜斜細細長長的藍色雨絲，順著全場統一的風向斜落 */
        .rain-drop {
            width: 2px;
            top: -20vh;
            transform: rotate(var(--tilt));
            animation: rain-fall var(--dur) linear var(--delay) infinite;
        }
        @keyframes rain-fall {
            to { transform: translate(var(--drift), 125vh) rotate(var(--tilt)); }
        }
        /* 雪：兩層才有「飄」的感覺——外層等速直落，內層左右搖曳 */
        .snow-flake {
            top: -5vh;
            animation: snow-fall var(--dur) linear var(--delay) infinite;
        }
        @keyframes snow-fall {
            to { transform: translateY(115vh); }
        }
        .snow-flake > div {
            animation: snow-sway var(--sway) ease-in-out infinite alternate;
        }
        @keyframes snow-sway {
            from { transform: translateX(calc(var(--amp) * -1)); }
            to   { transform: translateX(var(--amp)); }
        }
        /* 風沙：淡黃色的橫向沙痕，順著風向橫掃全場、略微下沉 */
        .sand-grain {
            height: 2px;
            animation: sand-blow var(--dur) linear var(--delay) infinite;
        }
        @keyframes sand-blow {
            to { transform: translate(var(--travel), var(--dip)); }
        }
        /* 火星：熔岩的小火星從低處緩緩上飄、漸滅（ease-out：越高越慢） */
        .lava-ember {
            opacity: 0;
            animation: ember-rise var(--dur) ease-out var(--delay) infinite;
        }
        @keyframes ember-rise {
            0%   { transform: translate(0, 0); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translate(var(--sway), var(--rise)); opacity: 0; }
        }

        /* 季節落下物（season）：春櫻、夏綠葉、秋楓、冬雪。三層各司其職——
           .season-fall 等速落下並順風橫移、.season-sway 左右搖曳、
           .season-art 自轉（同時是那張像素圖）。三個動畫掛在同一個元素會
           互相蓋掉 transform，所以一層一件事。圖案與各段時長由 js/season.js
           逐片算好寫進 style；一樣是生成一次就交給 CSS，主迴圈零負擔 */
        #season {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1; /* 與天氣、夜色同層：地面之上、散步成員之下 */
        }
        #season > * {
            position: absolute;
            top: -12vh; /* 從畫面上緣外出發，落程 130vh 剛好整片穿出下緣 */
            will-change: transform;
        }
        .season-fall {
            animation: season-fall var(--dur) linear var(--delay) infinite;
        }
        @keyframes season-fall {
            to { transform: translate(var(--drift), 130vh); }
        }
        .season-sway {
            animation: season-sway var(--sway) ease-in-out infinite alternate;
        }
        @keyframes season-sway {
            from { transform: translateX(calc(var(--amp) * -1)); }
            to   { transform: translateX(var(--amp)); }
        }
        .season-art {
            background-size: 100% 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            animation: season-spin var(--spin) linear infinite;
        }
        @keyframes season-spin {
            to { transform: rotate(360deg); }
        }

        /* 夜晚演出（night）：入夜後才出現的星空、螢火蟲、地面光暈。
           這裡「刻意沒有」整頁的夜色底：鋪一層色溫就會蓋掉 OBS 場景與嵌入方
           的網頁，而背景透明是這個 widget 的前提。所以夜色全做成元素——
           粒子與貼著地面的漸層，天空本身維持全透明（詳見 js/night.js）。
           整層的 opacity 由 JS 依日落後經過的時間逐步調整，transition
           讓兩秒一次的節流看起來是連續變暗的。
           「亮幾顆」也跟著夜色走（見 js/night.js 的 revealNight）：沒亮的那些
           是 display: none，所以黃昏時連動畫都不跑 */
        #night {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1; /* 與天氣同層：地面之上、散步成員之下，夜色是背景 */
            transition: opacity 2s linear;
        }
        #night > * {
            position: absolute;
            will-change: opacity;
        }
        /* 星星：點陣風就是一顆小方點（不做圓角）。
           在自己的兩個亮度之間來回，週期與相位每顆都不同 */
        .night-star {
            animation: star-twinkle var(--dur) ease-in-out var(--delay) infinite alternate;
        }
        @keyframes star-twinkle {
            from { opacity: var(--dim); }
            to   { opacity: var(--lit); }
        }
        /* 螢火蟲：兩層才有「一邊飄一邊明滅」的感覺——
           外層緩緩游移，內層自己一明一滅（週期刻意跟飄移錯開） */
        .night-firefly {
            animation: firefly-drift var(--dur) ease-in-out var(--delay) infinite alternate,
                       firefly-in 1.6s ease-out both;
            will-change: transform, opacity;
        }
        @keyframes firefly-drift {
            to { transform: translate(var(--dx), var(--dy)); }
        }
        /* 一隻一隻冒出來時淡入：螢火蟲帶著 8px 的光暈，直接從 display: none
           蹦出來看得出來。星星只有 1px 不必——而且牠們的 opacity 已經被
           閃爍動畫佔著，同一個屬性塞兩個動畫只會互相蓋掉 */
        @keyframes firefly-in {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .night-firefly > div {
            width: 3px;
            height: 3px;
            border-radius: 50%; /* 唯一的例外：發光的光點是圓的，方的看起來像壞點 */
            animation: firefly-blink var(--blink) ease-in-out var(--delay) infinite alternate;
        }
        @keyframes firefly-blink {
            from { opacity: 0.15; }
            to   { opacity: 1; }
        }
        /* 地面光暈：貼著頁面底邊的一條漸層，最濃處在地面表面、往上收乾成
           全透明。高度與顏色由 JS 依 nightGlow 與地面高度算好寫進 style */
        #night-glow {
            left: 0;
            right: 0;
            bottom: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            /* 閃爍與飄移收掉，靜態的星點與光暈留著——那是氛圍，不是動態 */
            .night-star, .night-firefly, .night-firefly > div { animation: none; }
            #night { transition: none; }
        }

        /* 丟果實餵食：點「空白處」掉下的像素樹果（canvas 畫的，不吃外部素材）。
           不可點擊——它是被吃的，不是被戳的；縮放錨在底邊中央，
           被咬小時往地面收，不會浮空 */
        .berry {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 20000; /* 蓋在隊伍前面：果實小，被大體型擋住就看不到吃相了 */
            transform-origin: 50% 100%;
        }

        /* 色違登場的星星粒子：從本體中心向外飛散、漸淡。
           每顆的飛行向量由 JS 用 CSS 變數（--dx / --dy）逐顆指定，
           動畫跑完由 animationend 移除元素 */
        .burst-star {
            position: absolute;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: none;
            animation: star-burst 1.5s ease-out forwards; /* 時長只是備援，JS 會依 shinyBurstDuration 覆寫 */
        }
        @keyframes star-burst {
            0%   { transform: translate(0, 0); opacity: 1; }
            60%  { opacity: 0.95; } /* 前 60% 幾乎不淡出，亮得夠久；尾段再一口氣收乾淨 */
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        .sprite {
            display: block;
            height: 64px; /* 預設高度，實際會由 JS 依體型分級覆寫 */
            width: auto;
            margin-bottom: 1px; /* 腳底抬離底邊 1px，視覺上站進貼底的影子裡 */
            /* 預設寶可夢通常是面向左下方的，這裡不需要額外調整，JS 會控制方向 */
            transform-origin: center bottom; /* 鏡像與跳躍都以腳底為基準（被抓起來時 JS 會改成身體中心） */
            will-change: transform;
            /* <img> 預設可以被原生拖放，會拖出一張半透明鬼影蓋掉我們自己的拖曳 */
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <!-- 設定檔與靜態身高對照表（必須和本 HTML 放在同一個資料夾）
         用 <script src> 而不是 fetch()：OBS / file:// 直接開檔時，
         fetch 讀取本地檔案會被 CORS 擋下，script 標籤則不受限制 -->
    <script src="./config.js"></script>
    <script src="./pokemon_heights.js"></script>
    <script src="./pokemon_types.js"></script>
    <script src="./pokemon_names.js"></script>
    <script src="./pokemon_cameo.js"></script>

    <!-- 主程式（js/ 資料夾）：一個檔案一個職責，載入順序 = 依賴順序（由上而下）。
         同樣用傳統 <script src> 而非 ES modules——modules 在 file:// 下會被 CORS
         擋下，雙擊開檔就壞了；也刻意不用打包工具，改完存檔重新整理就生效。
         所有檔案共用同一個全域作用域，這份清單是載入順序的唯一真理來源：
         單元測試照這份清單逐檔執行，順序寫錯（先用到後面檔案的東西）就紅燈 -->
    <script src="./js/params.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/sprites.js"></script>
    <script src="./js/ground.js"></script>
    <script src="./js/weather.js"></script>
    <script src="./js/season.js"></script>
