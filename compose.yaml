services:
  poke_stroll:
    env_file:
      - .env
    image: ${IMAGE}
    container_name: ${CONTAINER_NAME}
    # 刻意不發佈 ports：Traefik 與容器同在一個 docker network，直接連容器的 80。
    # 發佈到主機反而多開一條繞過閘道的直連通道。
    # 本機測試不走 compose，用 docker run -p 8080:80（見 DEPLOY.md）
    environment:
      - TZ=Asia/Taipei
    labels:
      - traefik.enable=true
      - traefik.http.routers.${CONTAINER_NAME}.rule=PathPrefix(`/${ROUTE_PREFIX}`)
      # /poke-stroll（無尾斜線）先 301 到 /poke-stroll/：
      # 頁面內的 ./config.js 等相對路徑要以「目錄」為基準才解析得到，
      # 少了尾斜線瀏覽器會把資源解析到網站根路徑而 404（API 服務沒差，靜態頁必須處理）
      - traefik.http.middlewares.${PREFIX_MID_NAME}-slash.redirectregex.regex=^(https?://[^/]+/${ROUTE_PREFIX})$$
      - traefik.http.middlewares.${PREFIX_MID_NAME}-slash.redirectregex.replacement=$${1}/
      - traefik.http.middlewares.${PREFIX_MID_NAME}-slash.redirectregex.permanent=true
      - traefik.http.middlewares.${PREFIX_MID_NAME}-stripprefix.stripprefix.prefixes=/${ROUTE_PREFIX}
      - traefik.http.routers.${CONTAINER_NAME}.middlewares=${PREFIX_MID_NAME}-slash,${PREFIX_MID_NAME}-stripprefix
      # v2 正式寫法明示後端埠（舊範本的 traefik.basic.port 是 v1 語法，v2 不吃；
      # 本檔的 middlewares 標籤都是 v2 才有的，代表閘道就是 v2——先前能動全靠
      # 自動偵測 image 的 EXPOSE 埠，明示比默契可靠）
      - traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${PORT}
      - traefik.docker.network=${NETWORK}
    networks:
      - ${NETWORK}
    # 頂層 restart 而非 deploy.restart_policy：後者在非 Swarm 的 compose 下支援度不一。
    # 無狀態靜態站，unless-stopped 讓主機重開機後也自動回來
    restart: unless-stopped
    # wget 是 nginx:alpine 內建的 busybox 版，不用另裝 curl
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M  # 純 nginx 靜態站，128M 綽綽有餘
        reservations:
          memory: 16M

networks:
  ipa_service_net:
    external: true
