# PokéStroll 靜態站設定（覆蓋 nginx image 內建的 default.conf）
#
# 快取策略（設計理由見 DEPLOY.md）：
# - widget HTML 與 config.js → no-cache：每次都走 ETag 協商（304 很便宜），
#   改版部署後所有訪客重新整理就立刻拿到新版，不會有新舊混用的混沌期
# - 圖鑑對照表 → 快取一天：內容綁定官方圖鑑幾乎不變，變了隔天生效也無妨
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 對照表三個檔案（身高/屬性/名字）合計數十 KB 的純文字，壓一下省一半流量
    gzip on;
    gzip_types application/javascript text/javascript;

    location ~ ^/pokemon_(heights|types|names)\.js$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        add_header Cache-Control "no-cache";
    }
}
