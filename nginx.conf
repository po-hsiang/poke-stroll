# PokéStroll 靜態站設定（覆蓋 nginx image 內建的 default.conf）
#
# 這支是 template：容器啟動時 nginx image 的 entrypoint 用 envsubst 把下面的
# CWA_ 開頭與 NGINX_LOCAL_RESOLVERS 這幾個環境變數換成實際的值，再落地成
# conf.d/default.conf。只換這幾個（Dockerfile 的 NGINX_ENVSUBST_FILTER），
# nginx 自己的 $uri 之類不會被誤換
#
# 快取策略（設計理由見 DEPLOY.md）：
# - widget HTML 與 config.js → no-cache：每次都走 ETag 協商（304 很便宜），
#   改版部署後所有訪客重新整理就立刻拿到新版，不會有新舊混用的混沌期
# - 圖鑑對照表 → 快取一天：內容綁定官方圖鑑幾乎不變，變了隔天生效也無妨
# - 即時天氣 → 伺服器端快取十分鐘：全部觀眾共用一份，氣象署那邊十分鐘才真的被問一次

proxy_cache_path /var/cache/nginx/cwa levels=1 keys_zone=cwa:1m max_size=1m inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 對照表三個檔案（身高/屬性/名字）合計數十 KB 的純文字，壓一下省一半流量
    gzip on;
    gzip_types application/javascript text/javascript;

    location ~ ^/pokemon_(heights|types|names)\.js$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        add_header Cache-Control "no-cache";
    }

    # 即時天氣：代轉中央氣象署的雨量觀測（O-A0002-001，單一測站），授權碼在這裡才補上。
    # 瀏覽器只看得到 ./api/weather，key 永遠不出伺服器（放進 config.js 的話，
    # 任何看 iframe 的人打開 DevTools 就拿得到）
    location = /api/weather {
        # 沒設 key（本機試跑、CI）就直接 503：widget 會退回擲骰，不必白打一趟氣象署
        set $cwa_key "${CWA_API_KEY}";
        if ($cwa_key = "") {
            return 503;
        }

        # 上游網域放變數、交給 resolver 在請求當下才解析。寫死的話 nginx 啟動時就要解析，
        # 那一刻剛好查不到 DNS 整站都起不來——為了天氣賠上 widget 不划算
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        resolver_timeout 3s;
        set $cwa_host opendata.cwa.gov.tw;

        # 資料集、測站、欄位全由這裡寫死（結尾的 ? = 丟掉瀏覽器帶來的 query）：
        # 別人沒辦法借我們的 key 去查別的資料集或別的測站
        rewrite ^ /api/v1/rest/datastore/O-A0002-001?StationId=${CWA_STATION_ID}&RainfallElement=Past10Min,Past1hr&GeoInfo=TownName? break;
        proxy_pass https://$cwa_host;
        proxy_ssl_server_name on;
        proxy_set_header Host $cwa_host;
        # key 走 header 而不是網址：上游出錯時 error log 會印出完整的上游網址
        proxy_set_header Authorization $cwa_key;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        proxy_cache cwa;
        proxy_cache_key cwa-rain;
        proxy_cache_valid 200 10m;
        # 快取過期那一刻同時湧進來的請求只放一個去問，其餘先拿舊的那份
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        add_header Cache-Control "no-cache";
        add_header X-Cache-Status $upstream_cache_status;
    }
}
